const BIND_NUM = { feeDomestic: ["fees", "domestic"], feePacking: ["fees", "packing"], feeCustoms: ["fees", "customs"], feeOther: ["fees", "other"], intlFreight: ["logi", "freight"], insuranceRate: ["logi", "insRate"], clearanceFee: ["logi", "clearance"], fxRate: ["logi", "fx"], profitRate: ["price", "profit"], grossWeight: ["logi", "gw"], volumeCbm: ["logi", "vol"] };
const BIND_TXT = {
  offerNo: ["meta", "no"], offerDate: ["meta", "date"], fxDate: ["logi", "fxDate"],
  buyerName: ["party", "buyer"], sellerName: ["party", "seller"], remark: ["party", "remark"],
  buyerAddr: ["party", "buyerAddr"], sellerAddr: ["party", "sellerAddr"],
  sellerTel: ["party", "sellerTel"], sellerMail: ["party", "sellerMail"], sellerWeb: ["party", "sellerWeb"],
  payTerms: ["deal", "pay"], leadTime: ["deal", "lead"], packing: ["deal", "packing"],
  origin: ["deal", "origin"], moq: ["deal", "moq"]
};
const BIND_SEL = { validDays: ["meta", "validDays"], destCountry: ["logi", "country"], terms: ["logi", "terms"], fxSource: ["logi", "fxSource"], profitMode: ["price", "mode"], quoteCcy: ["price", "ccy"] };

function bindEvents() {
  Object.keys(BIND_TXT).forEach(id => {
    const el = $(id), p = BIND_TXT[id];
    el.addEventListener("input", () => { state[p[0]][p[1]] = el.value; schedule(); });
  });
  Object.keys(BIND_NUM).forEach(id => {
    const el = $(id), p = BIND_NUM[id];
    el.addEventListener("input", () => {
      const raw = el.value;
      if (raw.trim() === "") { state[p[0]][p[1]] = null; el.classList.remove("bad"); }
      else {
        const n = toNum(raw, NaN);
        if (isNaN(n)) { state[p[0]][p[1]] = null; el.classList.add("bad"); }
        else { state[p[0]][p[1]] = n; el.classList.toggle("bad", n < 0); }
      }
      if (p[1] === "fx" && state.logi.fxSource === "builtin") {
        state.logi.fxSource = "manual";
        const fs = $("fxSource"); if (fs) fs.value = "manual";
      }
      schedule();
    });
    el.addEventListener("blur", () => {
      const v = state[p[0]][p[1]];
      if (v != null && !isNaN(v)) el.value = String(v);
      else if (v === null) el.value = "";
    });
  });
  Object.keys(BIND_SEL).forEach(id => {
    const el = $(id), p = BIND_SEL[id];
    el.addEventListener("change", () => {
      state[p[0]][p[1]] = el.value;
      if (id === "destCountry") onCountryChange();
      if (id === "validDays") updateValidHint();
      if (id === "profitMode") { /* 仅切换口径，保留利润率 */ }
      if (id === "quoteCcy") renderFxStamp();
      schedule();
    });
  });
  ["fxRUB", "fxKZT", "fxUZS"].forEach(id => {
    const el = $(id), code = id.slice(2);
    el.addEventListener("input", () => {
      const raw = el.value;
      if (raw.trim() === "") { state.logi.fxBook[code] = null; el.classList.add("bad"); }
      else {
        const v = toNum(raw, NaN);
        if (isNaN(v) || v <= 0) { state.logi.fxBook[code] = null; el.classList.add("bad"); }
        else { state.logi.fxBook[code] = v; el.classList.remove("bad"); }
      }
      state.logi.fxMeta = { src: "manual", at: nowStamp(), provider: (state.logi.fxMeta || {}).provider || "" };
      if (state.logi.fxSource === "builtin") {
        state.logi.fxSource = "manual";
        const fs = $("fxSource"); if (fs) fs.value = "manual";
      }
      renderFxStamp();
      schedule();
    });
    el.addEventListener("blur", () => {
      if (!(state.logi.fxBook[code] > 0)) state.logi.fxBook[code] = FX_BOOK_DEF[code];
      el.value = String(Number(fxBookGet(code).toFixed(fxDecimals(code))));

      renderFxStamp();
      schedule();

    const inp = e.target.closest("input");
    if (!inp) return;
    const tr = inp.closest("tr"), l = state.lines.filter(x => x.id === tr.dataset.id)[0];
    if (!l) return;
    const f = inp.dataset.f;
    if (f === "product" || f === "hs" || f === "unit") { l[f] = inp.value; }
    else {
      const raw = inp.value;
      if (raw.trim() === "") { l[f] = null; inp.classList.remove("bad"); }
      else {
        const n = toNum(raw, NaN);
        if (isNaN(n)) { l[f] = null; inp.classList.add("bad"); }
        else { l[f] = n; inp.classList.toggle("bad", n < 0); }
      }
      if (["vatIn", "refund", "duty", "vat"].indexOf(f) >= 0) { l.rateSrc = "manual"; scheduleRateMemo(l); }
    }
    schedule();
  });
  $("lineBody").addEventListener("change", e => {
    const inp = e.target.closest("input");
    if (!inp) return;
    const tr = inp.closest("tr"), l = state.lines.filter(x => x.id === tr.dataset.id)[0];
    if (!l) return;
    const f = inp.dataset.f;
    if (f === "hs") {
      const code = String(l.hs || "").trim();
      const lib = HS_DB.filter(h => h.code === code)[0];
      if (lib) {
        if (!l.product) l.product = lib.zh;
        const r = ratesFor(code, state.logi.country);
        l.duty = r.duty; l.vat = r.vat;
        if (r.src === "memory") { l.vatIn = r.vatIn; l.refund = r.refund; }
        l.rateSrc = r.src;
      }
      renderLines(true);
      render();
    }
    if (["vatIn", "refund", "duty", "vat"].indexOf(f) >= 0) scheduleRateMemo(l);
  });
  $("lineBody").addEventListener("click", e => {
    const btn = e.target.closest("[data-act='del']");
    if (!btn) return;
    const tr = btn.closest("tr");
    deleteLine(tr.dataset.id);
  });

  let hsTimer = null;
  $("hsSearch").addEventListener("input", () => {
    clearTimeout(hsTimer);
    hsTimer = setTimeout(() => { hsShown = HS_PAGE; hsKb = -1; renderHs(); }, 120);
  });
  $("hsCat").addEventListener("change", () => { hsShown = HS_PAGE; hsKb = -1; renderHs(); });
  $("onlyHot").addEventListener("change", () => { hsShown = HS_PAGE; hsKb = -1; renderHs(); });
  $("btnMoreHs").addEventListener("click", () => { hsShown += HS_PAGE; renderHs(); });
  $("hsList").addEventListener("click", e => {
    const it = e.target.closest(".hs-item");
    if (it) fillLineFromHs(it.dataset.code);
  });
  $("hsList").addEventListener("keydown", e => {
    const n = Math.min(hsShown, hsRows.length);
    if (!n) return;
    if (e.key === "ArrowDown") { hsKb = Math.min(n - 1, hsKb + 1); focusKb(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { hsKb = Math.max(0, hsKb - 1); focusKb(); e.preventDefault(); }
    else if (e.key === "Enter") { const x = hsRows[hsKb]; if (x) { fillLineFromHs(x.code); e.preventDefault(); } }
    else if (e.key === "Escape") { hsKb = -1; renderHs(); }
  });

  $("btnSave").addEventListener("click", openSave);
  $("btnLoad").addEventListener("click", openLoad);
  $("btnHistory").addEventListener("click", openHistory);
  $("btnCopy").addEventListener("click", copySummary);
  $("btnCsv").addEventListener("click", exportCsv);
  $("btnExport").addEventListener("click", exportJson);
  $("btnImport").addEventListener("click", () => $("fileInput").click());
  $("fileInput").addEventListener("change", importJson);
  $("dlgClose").addEventListener("click", () => $("dlg").close());
}
function focusKb() {
  renderHs();

}

function addLine() {
  if (state.lines.length >= MAX_LINES) return;
  const last = state.lines[state.lines.length - 1];
  const c = COUNTRY[state.logi.country] || COUNTRY.CUSTOM;
  const l = newLine({ unit: last ? last.unit : t("unitDefault"), duty: c.duty, vat: c.vat, rateSrc: "preset" });
  state.lines.push(l);
  state.activeLineId = l.id;
  renderLines(true);
  renderHs();
  render();
  const inp = $("lineBody").querySelector('tr[data-id="' + l.id + '"] input[data-f="product"]');
  if (inp) inp.focus();
}
function deleteLine(id) {
  const i = state.lines.findIndex(x => x.id === id);
  if (i < 0) return;
  if (state.lines.length === 1) {
    state.lines[0] = newLine({ id: id, duty: (COUNTRY[state.logi.country] || COUNTRY.CUSTOM).duty, vat: (COUNTRY[state.logi.country] || COUNTRY.CUSTOM).vat });
    state.activeLineId = id;
  } else {
    state.lines.splice(i, 1);
    if (state.activeLineId === id) state.activeLineId = state.lines[Math.max(0, i - 1)].id;
  }
  renderLines(true);
  renderHs();
  render();
}
const rateMemoTimers = new Map();
function scheduleRateMemo(l) {
  clearTimeout(rateMemoTimers.get(l.id));
  rateMemoTimers.set(l.id, setTimeout(() => {
    const hs = String(l.hs || "").trim();
    if (!hs) return;
    if ([l.vatIn, l.refund, l.duty, l.vat].some(v => v == null)) return;
    saveRate(hs, state.logi.country, { duty: l.duty, vat: l.vat, vatIn: l.vatIn, refund: l.refund });
    updateRatesMemInfo();
  }, 500));
}
function onCountryChange() {
  const c = COUNTRY[state.logi.country] || COUNTRY.CUSTOM;
  let manual = 0;
  state.lines.forEach(l => {
    if (l.rateSrc === "manual") { manual++; return; }
    const memo = ratesFor(String(l.hs || "").trim(), state.logi.country);
    l.duty = memo.duty; l.vat = memo.vat;
    if (memo.src === "memory") { l.vatIn = memo.vatIn; l.refund = memo.refund; l.rateSrc = "memory"; }
    else l.rateSrc = "preset";
    if (!(memo.duty > 0) && !(memo.vat > 0)) { l.duty = c.duty; l.vat = c.vat; }
  });
  renderLines(true);
  if (manual) flash(tf("warnManualRate", { n: manual }));
}

/* ---------------- 报价摘要（一键复制给客户） ---------------- */
function buildSummaryText() {
  const R = calc();
  const ccy = state.price.ccy, f = ccyFactor(), sym = symOf(ccy);
  const M = v => sym + fmt(v / f, decOf(ccy, v / f));
  const countryName = t("c_" + state.logi.country);
  const termName = t({ FOB: "termFob", CFR: "termCfr", CIF: "termCif", DDP: "termDdp" }[state.logi.terms] || "termCif");
  const L = [];
  L.push("== " + t("sheetTitle") + " " + (state.meta.no || "") + " ==");
  L.push(t("metaDate") + ": " + (state.meta.date || "-") + "  |  " + t("thCountry") + ": " + countryName + "  |  " + t("termsLabel") + ": " + termName);
  if (state.party.buyer || state.party.buyerAddr) L.push(t("thBuyer") + ": " + state.party.buyer + (state.party.buyerAddr ? " / " + state.party.buyerAddr : ""));
  if (state.party.seller || state.party.sellerAddr) {
    const sc = [];
    if (state.party.seller) sc.push(state.party.seller);
    if (state.party.sellerAddr) sc.push(state.party.sellerAddr);
    if (state.party.sellerTel) sc.push("Tel " + state.party.sellerTel);
    if (state.party.sellerMail) sc.push("Email " + state.party.sellerMail);
    if (state.party.sellerWeb) sc.push(state.party.sellerWeb);
    L.push(t("thSeller") + ": " + sc.join(" / "));
  }
  [["payTerms", state.deal.pay], ["leadTime", state.deal.lead], ["packing", state.deal.packing],
   ["origin", state.deal.origin], ["moq", state.deal.moq]].forEach(p => {
    if (p[1]) L.push(t(p[0]) + ": " + p[1]);
  });
  R.lines.forEach((x, i) => {
    const amount = R.quoteTotal * x.share;
    const up = x.qty > 0 ? amount / x.qty : 0;
    const lib = HS_DB.filter(h => h.code === x.l.hs)[0];
    let nm = x.l.product || "-";
    if (lang === "ru" && lib) nm = (!x.l.product || x.l.product === lib.zh) ? lib.ru : (x.l.product + " / " + lib.ru);
    L.push((i + 1) + ". " + nm + " (HS " + (x.l.hs || "-") + ")  " +
      fmt(x.qty, 2) + " " + unitLabel(x.l.unit) + " x " + M(up) + " = " + M(amount));
  });
  L.push(t("kpiQuoteTotal") + ": " + M(R.quoteTotal) + "  (" + ccy + ")");
  const locTotal = R.lines.reduce((a, x) => {
    const amt = R.quoteTotal * x.share / f;
    return a + (decOf(ccy, amt) === 0 ? Math.round(amt) : Math.round(amt * 100) / 100);
  }, 0);
  const WW = amountWords(locTotal, ccy);
  L.push(WW.en);
  if (lang === "ru") L.push(WW.ru);
  if (WW.zh) L.push(WW.zh);
  const gwS = toNum(state.logi.gw, 0), volS = toNum(state.logi.vol, 0);
  const ldS = suggestLoad(gwS, volS);
  if (ldS) {
    const b = [];
    if (gwS > 0) b.push(t("grossWeight") + " " + fmt(gwS, 2));
    if (volS > 0) b.push(t("volumeCbm") + " " + fmt(volS, 3));
    b.push(tf("loadSuggest", { n: ldS.n, k: ldS.k, cbm: ldS.cbm, kg: fmt(ldS.kg, 0) }));
    L.push(b.join(" · "));
  }
  L.push("FX: 1 USD = " + fmt(R.fx, 4) + " CNY");
  if (R.validUntil) L.push(t("validTo") + ": " + R.validUntil + (R.expired ? " (" + t("sheetExpiredTag") + ")" : ""));
  if (state.party.remark) L.push("Remark: " + state.party.remark);
  return L.join("\n");
}
function fallbackCopy(txt, done) {
  const ta = document.createElement("textarea");
  ta.value = txt;
  ta.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0";
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  ta.remove();
  if (ok) done(); else flash(t("copyFail"));
}
function copySummary() {
  const txt = buildSummaryText();
  const done = () => flash(t("copyOk"));
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
  } else fallbackCopy(txt, done);
}

function exportCsv() {
  const R = calc();
  const ccy = state.price.ccy, f = ccyFactor();
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const rows = [];
  rows.push([t("metaOfferNo"), state.meta.no, t("metaDate"), state.meta.date, t("validTo"), R.validUntil || ""].map(q).join(","));
  rows.push([t("thBuyer"), state.party.buyer || "", t("thSeller"), state.party.seller || "",
             t("thCountry"), t("c_" + state.logi.country), t("termsLabel"), state.logi.terms].map(q).join(","));
  if (state.party.buyerAddr || state.party.sellerAddr) {
    rows.push([t("buyerAddr"), state.party.buyerAddr || "", t("sellerAddr"), state.party.sellerAddr || ""].map(q).join(","));
  }
  if (state.party.sellerTel || state.party.sellerMail || state.party.sellerWeb) {
    rows.push([t("sellerTel"), state.party.sellerTel || "", t("sellerMail"), state.party.sellerMail || "",
               t("sellerWeb"), state.party.sellerWeb || ""].map(q).join(","));
  }
  const dealPairs = [["payTerms", state.deal.pay], ["leadTime", state.deal.lead], ["packing", state.deal.packing],
                     ["origin", state.deal.origin], ["moq", state.deal.moq]];
  if (dealPairs.some(p => p[1])) {
    const r = [];
    dealPairs.forEach(p => { if (p[1]) r.push(t(p[0]), p[1]); });
    rows.push(r.map(q).join(","));
  }
  const fxHead = ["FX(1USD=CNY)", fmt(R.fx, 4), "CCY", ccy];
  if (ccy !== "USD" && ccy !== "CNY") fxHead.push("FX(1" + ccy + "=CNY)", fmt(ccyFactor(), ccy === "UZS" ? 6 : 4));
  fxHead.push("FX_SRC", (state.logi.fxMeta || {}).src || "manual", "FX_AT", (state.logi.fxMeta || {}).at || "");
  rows.push(fxHead.map(q).join(","));
  rows.push("");
  rows.push([t("colIdx"), t("colProduct"), t("colHs"), t("colUnit"), t("colQty"), t("colPrice"),
             t("colVatIn"), t("colRefund"), t("colDuty"), t("colVat"), t("colSubtotal"),
             t("thUnitPrice") + "(" + ccy + ")", t("thAmount") + "(" + ccy + ")"].map(q).join(","));
  R.lines.forEach((x, i) => {
    const amount = R.quoteTotal * x.share;
    const up = x.qty > 0 ? amount / x.qty : 0;
    rows.push([i + 1, x.l.product || "", x.l.hs || "", unitLabel(x.l.unit), x.qty, x.price,
               n0(x.l.vatIn), n0(x.l.refund), n0(x.l.duty), n0(x.l.vat), x.sub.toFixed(2),
               (up / f).toFixed(2), (amount / f).toFixed(2)].map(q).join(","));
  });
  rows.push("");
  rows.push([t("kpiQuoteTotal") + "(" + ccy + ")", (R.quoteTotal / f).toFixed(2),
             t("rLandedFull") + "(CNY)", R.landedFull.toFixed(2),
             t("kpiMargin"), (R.margin * 100).toFixed(1) + "%"].map(q).join(","));
  const cLocTotal = R.lines.reduce((a, x) => {
    const amt = R.quoteTotal * x.share / f;
    return a + (decOf(ccy, amt) === 0 ? Math.round(amt) : Math.round(amt * 100) / 100);
  }, 0);
  const cW = amountWords(cLocTotal, ccy);
  rows.push([t("sayTotal"), cW.en].map(q).join(","));
  if (cW.zh) rows.push([t("sayTotal") + "(CN)", cW.zh].map(q).join(","));
  const cGw = toNum(state.logi.gw, 0), cVol = toNum(state.logi.vol, 0);
  if (cGw > 0 || cVol > 0) {
    rows.push([t("grossWeight"), cGw ? String(cGw) : "",
               t("volumeCbm"), cVol ? String(cVol) : ""].map(q).join(","));
  }
  const blob = new Blob(["\ufeff" + rows.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (state.meta.no || "quote") + ".csv";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

  } else {
    box.classList.remove("invalid");
    if (u) u.textContent = $("kpiUnit") ? $("kpiUnit").textContent.trim() : "—";
    if (tt) tt.textContent = $("kpiTotal") ? $("kpiTotal").textContent.trim() : "—";
    const R = calc();
    const unitProfit = R.quoteUnit - R.unitCost;
    if (mg) {
      mg.textContent = money(unitProfit);
      mg.classList.toggle("neg", unitProfit < -0.0001);
    }
    if (mgP) mgP.textContent = pct(R.margin) + " · " + t("srMarginLab");
    if (R.margin < 0) { warn = tf("srLoss", { p: pct(R.margin) }); tone = "bad"; }
    else if (R.margin < 0.05) { warn = tf("srLowMargin", { p: pct(R.margin) }); tone = "low"; }
  }
  if (w) { w.hidden = !warn; w.textContent = warn; w.className = "sr-warn" + (tone ? " " + tone : ""); }
  if (basis) {
    const fxMeta = state.logi.fxMeta || {};
    const srcMap = { builtin: "fxBuiltin", manual: "fxManual", online: "fxSrcOnline" };
    const srcTxt = t(srcMap[fxMeta.src] || "fxManual");
    const uName = unitLabel(l && l.unit) || t("unitDefault");
    basis.textContent = tf("srBasisTxt", {
      country: t("c_" + state.logi.country),
      terms: state.logi.terms,
      duty: n0(l ? l.duty : 0),
      vat: n0(l ? l.vat : 0),
      fx: fmt(state.logi.fx, 4),
      src: srcTxt
    }) + " · " + tf("srUnitNote", { u: uName });
  }
}
/* ---------------- v3.8: 目标价倒算 / 历史价对比 / 客户短句 ---------------- */
function srTargetEls() {
  return { box: $("srTargetBox"), out: $("srTargetOut"), tp: $("srTargetPrice"), tm: $("srTargetMargin"), tg: $("srTargetToggle") };
}
/* 二分求解：客户目标单价 tpCny（CNY/件）固定时，为保住毛利率 m，第 1 行采购单价的上限（CNY）。不可达返回 null */
function solveMaxPrice(tpCny, m) {
  const l = simpleTargetLine();
  if (!l || !(tpCny > 0)) return null;
  const save = l.price;
  const fm = pr => { l.price = pr; const R = calc(); return (tpCny - R.unitCost) / tpCny; };
  let res;
  const HI = 1e7;
  const m0 = fm(0);
  if (m0 < m - 1e-9) res = null;
  else if (fm(HI) >= m) res = HI;
  else {
    let lo = 0, hi = HI;
    for (let i = 0; i < 60; i++) {
      const mid = (lo + hi) / 2;
      if (fm(mid) >= m) lo = mid; else hi = mid;
    }
    res = lo;
  }
  l.price = save;
  return res;
}
function renderTargetCalc() {
  const E = srTargetEls();
  if (!E.box || !E.out) return;
  const exp = !E.box.hidden;
  if (E.tg) {
    E.tg.textContent = t(exp ? "srTargetHide" : "srTargetToggle");
    E.tg.setAttribute("aria-expanded", exp ? "true" : "false");
  }
  if (!exp) { E.out.textContent = ""; E.out.className = "sr-target-out"; return; }
  const l = simpleTargetLine();
  const tp = n0(E.tp ? E.tp.value : 0);
  const tm = clamp(toNum(E.tm ? E.tm.value : 5, 5), 0, 90) / 100;
  if (!(tp > 0)) {
    E.out.textContent = t("srTargetNeed");
    E.out.className = "sr-target-out";
    return;
  }
  const R = calc();
  const f = ccyFactor();
  const targetUnitCny = tp * f;
  const unitProfit = targetUnitCny - R.unitCost;
  const mg = targetUnitCny > 0 ? unitProfit / targetUnitCny : 0;
  let html;
  const maxP = solveMaxPrice(targetUnitCny, tm);
  if (maxP == null) {
    html = esc(tf("srTargetImpossible", { m: pct(tm) }));
  } else if (maxP >= 1e7 - 1) {
    html = esc(tf("srTargetMax", { p: "\u00a5" + fmt(maxP, 2), m: pct(tm) })) + " · " + esc(t("srTargetOK"));
  } else {
    html = esc(tf("srTargetMax", { p: "\u00a5" + fmt(maxP, 2), m: pct(tm) }));
    const curP = l ? n0(l.price) : 0;
    if (curP > 0) {
      const cut = (curP - maxP) / curP;
      html += " · " + esc(cut > 0.005
        ? tf("srTargetNeedCut", { cur: "\u00a5" + fmt(curP, 2), d: pct(cut) })
        : t("srTargetOK"));
    }
  }
  html += "<br>" + esc(unitProfit < 0
    ? tf("srTargetLoss", { p: money(unitProfit), m: pct(mg) })
    : tf("srTargetProfit", { p: money(unitProfit), m: pct(mg) }));
  E.out.innerHTML = html;
  E.out.className = "sr-target-out" + (unitProfit < 0 ? " bad" : (mg < tm ? " low" : ""));
}
function renderSimpleHist() {
  const el = $("srHist");
  if (!el) return;
  const l = simpleTargetLine();
  const prod = l ? String(l.product || "").trim() : "";
  const hs = l ? String(l.hs || "").trim() : "";
  const cur = l ? n0(l.price) : 0;
  if ((!prod && !hs) || !(cur > 0)) { el.hidden = true; el.textContent = ""; el.className = "sr-hist"; return; }
  const cands = histList()
    .filter(h => h && h.data && Array.isArray(h.data.lines) && h.data.lines[0])
    .map(h => ({ ts: h.ts, l0: h.data.lines[0] }))
    .filter(x => (prod && String(x.l0.product || "").trim() === prod) || (hs && String(x.l0.hs || "").trim() === hs))
    .filter(x => n0(x.l0.price) > 0)
    .sort((x, y) => y.ts - x.ts);
  const hit = cands[0];
  if (!hit) { el.hidden = true; el.textContent = ""; el.className = "sr-hist"; return; }
  const prev = n0(hit.l0.price);
  const d = (cur - prev) / prev;
  const dateStr = new Date(hit.ts).toLocaleDateString(lang === "ru" ? "ru-RU" : "zh-CN");
  const pTxt = "\u00a5" + fmt(prev, 2);
  let txt;
  if (Math.abs(d) < 0.005) txt = tf("srHistSame", { p: pTxt, date: dateStr });
  else if (d > 0) txt = tf("srHistUp", { d: pct(d), p: pTxt, date: dateStr });
  else txt = tf("srHistDown", { d: pct(-d), p: pTxt, date: dateStr });
  el.hidden = false;
  el.textContent = txt;
  el.className = "sr-hist" + (d > 0.005 ? " up" : "");
}
/* ---------------- v3.9: 数量阶梯报价 ----------------
   客户最常问的一句是「1000 件什么价」。这里按当前整单数量的 0.5 / 1 / 2 / 5 / 10 倍
   自动算出各档单价、整票金额、每件毛利与毛利率。采购单价与各项费用率保持当前值不变，
   数量变大后整票固定运费分摊到每件的份额下降，单价自然走低——正是客户想看到的阶梯。 */
function tierBaseQty() {
  let t0 = 0;
  (state.lines || []).forEach(l => { t0 += Math.max(0, n0(l.qty)); });
  return t0 > 0 ? t0 : 0;
}
function tierLadder(base) {
  const out = [];
  [0.5, 1, 2, 5, 10].forEach(f => {
    let v = base * f;
    v = v >= 10 ? Math.round(v) : Math.max(1, Math.round(v));
    if (v > 0 && out.indexOf(v) < 0) out.push(v);
  });
  return out.sort((a, b) => a - b);
}
/* 临时把整单数量缩放到 target 执行 fn，结束后无论成败都还原（calc 只读 state） */
function withQty(target, fn) {
  const ls = state.lines || [];
  if (!ls.length) return fn();
  const save = ls.map(l => l.qty);
  const base = save.reduce((s, q) => s + Math.max(0, n0(q)), 0);
  if (!(base > 0)) return fn();
  let acc = 0;
  ls.forEach((l, i) => {
    const q = Math.max(0, n0(save[i]));
    let v = (i === ls.length - 1) ? Math.round(target - acc) : Math.round(q * target / base);
    if (!(v >= 0)) v = 0;
    acc += v;
    l.qty = v;
  });
  let r;
  try { r = fn(); } finally { ls.forEach((l, i) => { l.qty = save[i]; }); }
  return r;
}
function tierData() {
  const base = tierBaseQty();
  if (!(base > 0)) return null;
  const l = simpleTargetLine();
  const cur = calc();
  const rows = tierLadder(base).map(q => {
    const R = withQty(q, () => calc());
    return { qty: q, unit: R.quoteUnit, total: R.quoteTotal, unitProfit: R.quoteUnit - R.unitCost,
                totalProfit: R.quoteProfit, margin: R.margin, cur: false };
  });
  rows.forEach(r => { r.cur = Math.abs(r.qty - base) < 1e-9; });
  return { base: base, rows: rows, curUnit: cur.quoteUnit, unit: unitLabel(l && l.unit) || t("unitDefault") };
}
function renderTiers() {
  const box = $("srTierBox"), body = $("srTierBody"), note = $("srTierNote"), tg = $("srTierToggle"), title = $("srTierTitle");
  if (!box || !body) return;
  const exp = !box.hidden;
  if (tg) {
    tg.textContent = t(exp ? "srTierHide" : "srTierToggle");
    tg.setAttribute("aria-expanded", exp ? "true" : "false");
  }
  if (!exp) { body.innerHTML = ""; if (note) note.textContent = ""; return; }
  const d = tierData();
  if (!d) {
    body.innerHTML = "";
    if (title) title.textContent = t("srTierName");
    if (note) note.textContent = t("srTierNeed");
    return;
  }
  if (title) title.textContent = t("srTierName");
  body.innerHTML = d.rows.map(r => {
    const dlt = d.curUnit > 0 ? (r.unit - d.curUnit) / d.curUnit : 0;
    const cls = r.margin < 0 ? " bad" : (r.margin < 0.05 ? " low" : "");
    let dl = "";
    if (!r.cur && Math.abs(dlt) >= 0.0005) dl = '<span class="t-delta">' + (dlt > 0 ? "+" : "") + pct(dlt) + "</span>";
    return "<tr" + (r.cur ? ' class="cur"' : "") + ">" +
      "<td>" + fmt(r.qty, 0) + (r.cur ? '<span class="t-tag">' + esc(t("srTierCurTag")) + "</span>" : "") + "</td>" +
      "<td>" + money(r.unit) + dl + "</td>" +
      "<td>" + money(r.total) + "</td>" +
      "<td>" + money(r.unitProfit) + "</td>" +
      '<td class="t-gp">' + money(r.totalProfit) + "</td>" +
      '<td class="t-margin' + cls + '">' + pct(r.margin) + "</td>" +
      "</tr>";
  }).join("");
  if (note) {
    /* 没有任何整票固定费用时，单价不会随数量变化——必须点明原因，否则用户以为功能失灵 */
    const flat = d.rows.length > 1 && Math.abs(d.rows[0].unit - d.rows[d.rows.length - 1].unit) < 1e-6;
    const pr = state.price || {};
    const pv = n0(pr.profit);
    const basis = pr.mode === "margin"
      ? tf("srTierBasisMargin", { p: fmt(pv, pv % 1 ? 1 : 0) })
      : tf("srTierBasisMarkup", { p: fmt(pv, pv % 1 ? 1 : 0) });
    note.textContent = (flat ? t("srTierFlat") + " " : "") + t("srTierNote") + " " + basis;
    note.className = "sr-tiers-note" + (flat ? " flat" : "");
  }
}
function tierText() {
  const d = tierData();
  if (!d) return "";
  const l = simpleTargetLine();
  const head = tf("srTierCopyHead", {
    product: (l && l.product) || t("shareNoProduct"),
    country: t("c_" + state.logi.country),
    terms: state.logi.terms
  });
  const out = [head, [t("srTierQty"), t("srTierUnit"), t("srTierTotal"), t("srTierProfit"), t("srTierGp"), t("srTierMargin")].join("\t")];
  d.rows.forEach(r => {
    out.push([fmt(r.qty, 0) + d.unit, money(r.unit), money(r.total), money(r.unitProfit),
      money(r.totalProfit), pct(r.margin)].join("\t"));
  });
  return out.join("\n");
}
function buildShareText() {
  const l = simpleTargetLine();
  const R = calc();
  const uName = unitLabel(l && l.unit) || t("unitDefault");
  const seller = String(state.party && state.party.seller || "").trim();
  let s = tf("shareTpl", {
    product: (l && l.product) ? l.product : t("shareNoProduct"),
    qty: fmt(n0(l ? l.qty : 0), 0),
    unit: uName,
    unit_price: money(R.quoteUnit),
    total: money(R.quoteTotal),
    terms: state.logi.terms,
    country: t("c_" + state.logi.country),
    valid: R.validUntil || "\u2014"
  });
  if (seller) s += "\n" + seller;
  return s;
}
function copyShare() {
  const txt = buildShareText();
  const done = () => flash(t("srShareDone"));
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = txt;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let okc = false;
    try { okc = document.execCommand("copy"); } catch (e) { okc = false; }
    document.body.removeChild(ta);
    flash(t(okc ? "srShareDone" : "srShareFail"));
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done).catch(fallback);
  } else fallback();
  return txt;
}
/* 通用复制（纯文本），okMsg 为已翻译提示文案 */
function copyPlain(txt, okMsg) {
  if (!txt) return;
  const done = () => flash(okMsg);
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = txt;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let okc = false;
    try { okc = document.execCommand("copy"); } catch (e) { okc = false; }
    document.body.removeChild(ta);
    flash(okc ? okMsg : t("srShareFail"));
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done).catch(fallback);
  } else fallback();
}
function bindSrTools() {
  const E = srTargetEls();
  if (E.tm && !String(E.tm.value || "").trim()) E.tm.value = "5";
  if (E.tg && E.box) {
    E.tg.addEventListener("click", () => {
      E.box.hidden = !E.box.hidden;
      renderTargetCalc();
    });
  }
  [E.tp, E.tm].forEach(el => { if (el) el.addEventListener("input", renderTargetCalc); });
  const sh = $("srShare");
  if (sh) sh.addEventListener("click", () => { copyShare(); });
  const tgb = $("srTierToggle"), tbx = $("srTierBox");
  if (tgb && tbx) {
    tgb.addEventListener("click", () => {
      tbx.hidden = !tbx.hidden;
      renderTiers();
    });
  }
  const tc = $("srTierCopy");
  if (tc) tc.addEventListener("click", () => { copyPlain(tierText(), t("srTierCopyDone")); });
  bindCust();
}
function syncSimple() {
  if (!state) return;
  fillSimpleSelects(false);
  const l = simpleTargetLine();
  setVal($("sCountry"), state.logi.country);
  setVal($("sTerms"), state.logi.terms);
  setVal($("sProduct"), l ? (l.product || "") : "");
  setVal($("sQty"), l ? numVal(l.qty) : "");
  setVal($("sPrice"), l ? numVal(l.price) : "");
  setVal($("sProfit"), numVal(state.price.profit));
  updateSimpleResult();
  renderSimpleHist();
  renderTargetCalc();
  renderTiers();
  const hint = $("simpleHint");
  if (hint) {
    const n = state.lines.length;
    if (n > 1) { hint.textContent = tf("simpleMultiLine", { n: n }); hint.className = "hint warn"; }
    else { hint.textContent = t("simpleHintOne"); hint.className = "hint"; }
  }
}
function applyUiMode() {
  document.body.dataset.mode = uiMode;
  const b = $("btnMode");
  if (b) {
    b.textContent = uiMode === "simple" ? t("modeToPro") : t("modeToSimple");
    b.setAttribute("aria-pressed", uiMode === "simple" ? "true" : "false");
  }
  if (uiMode === "simple") syncSimple();
  else {
    const pnl = $("inputPanel");
    if (pnl) pnl.classList.remove("open");
    const sp = $("btnSimplePro");
    if (sp) sp.textContent = t("simpleOpenPro");
  }
}
function applyFontScale() {
  document.body.dataset.fs = uiFs;
  const el = $("fontScale");
  if (el) el.value = uiFs;
}
function applyUiPrefs() {
  const m = localStorage.getItem(MEM_UI.mode);
  uiMode = m === "simple" ? "simple" : "pro";
  const f = localStorage.getItem(MEM_UI.fs);
  uiFs = (f === "115" || f === "130") ? f : "100";
  applyFontScale();
}
function setUiMode(m) {
  uiMode = (m === "simple") ? "simple" : "pro";
  try { localStorage.setItem(MEM_UI.mode, uiMode); } catch (e) { }
  applyUiMode();
  render();
}
function bindSimpleLang() {
  applyUiMode();
  const sp = $("btnSimplePro");
  if (sp) {
    const pnl = $("inputPanel");
    sp.textContent = pnl && pnl.classList.contains("open") ? t("simpleHidePro") : t("simpleOpenPro");
  }
}
function bindSimple() {
  const sc = $("sCountry");
  if (!sc) return;
  sc.addEventListener("change", () => {
    state.logi.country = sc.value;
    onCountryChange();
    syncSimple();
    render();
  });
  $("sTerms").addEventListener("change", () => { state.logi.terms = $("sTerms").value; schedule(); });
  $("sProduct").addEventListener("input", () => {
    const l = simpleTargetLine(); if (!l) return;
    l.product = $("sProduct").value;
    const tr = document.querySelector('#lineBody tr[data-id="' + l.id + '"]');
    const inp = tr && tr.querySelector('input[data-f="product"]');
    if (inp && inp.value !== l.product) inp.value = l.product;
    schedule();
  });
  const numBind = (id, key) => {
    const el = $(id);
    if (!el) return;
    el.addEventListener("input", () => {
      const l = simpleTargetLine(); if (!l) return;
      const raw = el.value;
      if (raw.trim() === "") l[key] = null;
      else { const n = toNum(raw, NaN); l[key] = isNaN(n) ? null : n; }
      const tr = document.querySelector('#lineBody tr[data-id="' + l.id + '"]');
      const inp = tr && tr.querySelector('input[data-f="' + key + '"]');
      if (inp && inp.value !== raw) inp.value = raw;
      schedule();
    });
  };
  numBind("sQty", "qty");
  numBind("sPrice", "price");
  $("sProfit").addEventListener("input", () => {
    const raw = $("sProfit").value;
    const n = raw.trim() === "" ? null : toNum(raw, NaN);
    state.price.mode = "markup";
    state.price.profit = (n == null || isNaN(n)) ? null : n;
    const pm = $("profitMode"); if (pm) pm.value = "markup";
    const pr = $("profitRate"); if (pr && pr.value !== raw) pr.value = raw;
    schedule();
  });
  $("btnSimplePrint").addEventListener("click", () => window.print());
  $("btnSimplePro").addEventListener("click", () => {
    const pnl = $("inputPanel");
    if (!pnl) return;
    const on = pnl.classList.toggle("open");
    $("btnSimplePro").textContent = on ? t("simpleHidePro") : t("simpleOpenPro");
    if (on) { try { pnl.scrollIntoView({ behavior: "smooth", block: "start" }); } catch (e) { pnl.scrollIntoView(); } }
  });
  $("btnMode").addEventListener("click", () => setUiMode(uiMode === "simple" ? "pro" : "simple"));
  $("fontScale").addEventListener("change", () => {
    const v = $("fontScale").value;
    uiFs = (v === "115" || v === "130") ? v : "100";
    try { localStorage.setItem(MEM_UI.fs, uiFs); } catch (e) { }
    applyFontScale();
  });
}

/* ---------------- 初始化 ---------------- */
function buildSelects() {
  $("destCountry").innerHTML = ["KZ", "UZ", "KG", "RU", "TJ", "TM", "CUSTOM"].map(c => '<option value="' + c + '">' + esc(t("c_" + c)) + "</option>").join("");
  $("hsCat").innerHTML = '<option value="">' + esc(lang === "ru" ? "Все категории" : "全部分类") + "</option>" +
    CATS.map(c => '<option value="' + esc(c) + '">' + esc(lang === "ru" ? (CAT_RU[c] || c) : c) + "</option>").join("");
  fillSimpleSelects(true);
}
function init() {
  const saved = localStorage.getItem(MEM.lang);
  lang = saved === "ru" || saved === "zh" ? saved : ((navigator.language || "").toLowerCase().indexOf("ru") === 0 ? "ru" : "zh");

  const draft = lsGet(MEM.draft, null);
  state = draft && typeof draft === "object" ? normalizeState(draft) : defaultState();
  if (!state.meta.no) state.meta.no = loadNo();
  if (!state.meta.date) state.meta.date = todayStr();
  state.activeLineId = state.lines[0] ? state.lines[0].id : null;

  buildSelects();
  applyI18n();
  syncDOM();
  bindEvents();
  bindSimple();
  bindSrTools();
  applyUiPrefs();
  renderHs();
  render();
  applyUiMode();
  if (draft) flash(t("warnDraft"));
}
document.addEventListener("DOMContentLoaded", init);
