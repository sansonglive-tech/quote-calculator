<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="中亚五国出口报价核算器：多行商品、四类贸易术语、VAT抵扣、汇率来源与有效期管理、中俄双语报价单">
<title>中亚出口报价核算器 v3 / Калькулятор экспортной цены</title>
<style>
  :root{
    --bg:#0f1115;--panel:#171a21;--panel2:#1d212a;--line:#2a2f3a;--txt:#e6e9ef;
    --sub:#9aa3b4;--acc:#4c8dff;--ok:#2ecc71;--warn:#f2b01e;--bad:#e74c3c;
    --gold:#e0a33a;--radius:10px;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.6;}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px;}
  header{padding:18px 24px 14px;border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
  header h1{font-size:19px;margin:0;font-weight:600;letter-spacing:.5px;}
  header .sub{color:var(--sub);font-size:12.5px;}
  .toolbar{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
    padding:8px 13px;border-radius:6px;cursor:pointer;font-size:13px;transition:.15s;font-family:inherit;
    min-height:36px;}
  button:hover{border-color:var(--acc);color:#fff;}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;}
  button.primary:hover{background:#3d7bef;}
  button.mini{padding:4px 8px;min-height:28px;font-size:11.5px;color:var(--sub);}
  button.mini:hover{color:#fff;}
  button.danger{border-color:rgba(231,76,60,.45);color:#ff8f80;}
  button.danger:hover{background:rgba(231,76,60,.12);border-color:var(--bad);}
  button:disabled{opacity:.45;cursor:not-allowed;}
  select.lang{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
    padding:7px 10px;border-radius:6px;font-size:13px;cursor:pointer;min-height:36px;}

  #warnBar{display:none;margin:12px 24px 0;padding:10px 14px;border-radius:8px;font-size:12.5px;
    border:1px solid var(--line);background:var(--panel2);}
  #warnBar.on{display:block;}
  #warnBar.error{border-color:rgba(231,76,60,.5);background:rgba(231,76,60,.08);color:#ffb3aa;}
  #warnBar.warn{border-color:rgba(242,176,30,.45);background:rgba(242,176,30,.07);color:#f6d18a;}
  #warnBar.info{border-color:rgba(76,141,255,.4);background:rgba(76,141,255,.07);color:#a9c8ff;}
  #warnBar ul{margin:0;padding-left:18px;}
  #warnBar li{margin:2px 0;}

  main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(330px,.85fr);gap:18px;
    padding:16px 24px 8px;max-width:1560px;margin:0 auto;}
  @media(max-width:1020px){main{grid-template-columns:1fr;}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;min-width:0;}
  .panel h2{font-size:13px;color:var(--sub);font-weight:600;margin:0 0 12px;letter-spacing:1px;}
  fieldset{border:0;padding:0;margin:0 0 20px;min-width:0;}
  fieldset:last-child{margin-bottom:0;}
  legend{font-size:12.5px;color:var(--acc);font-weight:600;margin-bottom:9px;letter-spacing:.5px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;}
  .grid.g3{grid-template-columns:1fr 1fr 1fr;}
  .grid.g4{grid-template-columns:repeat(4,1fr);}
  .grid .full{grid-column:1/-1;}
  label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;}
  input,select,textarea{width:100%;min-width:0;background:#0d1014;border:1px solid var(--line);color:var(--txt);
    padding:8px 10px;border-radius:6px;font-size:13.5px;font-family:inherit;}
  textarea{resize:vertical;min-height:52px;line-height:1.5;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);}
  input[type="checkbox"]{width:auto;accent-color:var(--acc);}
  .hint{font-size:11.5px;color:var(--sub);margin-top:5px;line-height:1.5;}
  .hint.warn{color:var(--warn);}
  .hint.err{color:#ff9b90;}
  .inline{display:flex;gap:6px;align-items:center;}
  .inline input{min-width:0;}
  .tag{display:inline-block;font-size:10.5px;line-height:1;padding:3px 6px;border-radius:4px;
    background:#1b2029;color:#7d8798;border:1px solid #232935;white-space:nowrap;}
  .tag.ok{color:#7ee2a8;border-color:rgba(46,204,113,.35);background:rgba(46,204,113,.1);}
  .tag.warn{color:var(--gold);border-color:rgba(224,163,58,.35);background:rgba(224,163,58,.12);}
  .tag.bad{color:#ff9b90;border-color:rgba(231,76,60,.4);background:rgba(231,76,60,.1);}

  /* ---------- 明细表 ---------- */
  .lines-wrap{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:8px;background:#0d1014;}
  table.lines{width:100%;border-collapse:collapse;min-width:788px;font-size:12.5px;}
  table.lines th{background:#151922;color:var(--sub);font-weight:600;font-size:11.5px;
    padding:7px 6px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line);}
  table.lines td{padding:5px 4px;border-bottom:1px solid #1a1d24;vertical-align:middle;}
  table.lines tr:last-child td{border-bottom:0;}
  table.lines input,table.lines select{padding:6px 6px;font-size:12.5px;border-radius:5px;}
  table.lines td.c-idx{color:var(--sub);text-align:center;font-variant-numeric:tabular-nums;width:30px;}
  table.lines td.c-prod{min-width:170px;}
  table.lines td.c-hs{width:98px;}
  table.lines td.c-qty{width:66px;}
  table.lines td.c-unit{width:56px;}
  table.lines td.c-price{width:88px;}
  table.lines td.c-rate{width:62px;}
  table.lines td.c-sub{width:100px;text-align:right;font-variant-numeric:tabular-nums;color:#cfe0ff;padding-right:8px;}
  table.lines td.c-act{width:34px;text-align:center;}
  table.lines tr.active td{background:rgba(76,141,255,.05);}
  table.lines input.num{text-align:right;font-variant-numeric:tabular-nums;}
  .lines-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;
    margin-top:8px;flex-wrap:wrap;}
  .lines-sum{font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums;}
  .lines-sum b{color:var(--txt);font-size:13.5px;}

  /* ---------- HS 选择器 ---------- */
  .hs-box{margin-top:10px;}
  .hs-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .hs-bar input[type="search"]{flex:1 1 200px;min-width:150px;}
  .hs-bar select{flex:0 0 auto;width:auto;max-width:190px;}
  .hs-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:7px;font-size:11.5px;color:var(--sub);flex-wrap:wrap;}
  .hs-list{max-height:190px;overflow:auto;margin-top:6px;border:1px solid var(--line);
    border-radius:6px;background:#0d1014;}
  .hs-item{display:flex;gap:9px;padding:7px 10px;cursor:pointer;border-bottom:1px solid #1a1d24;
    font-size:12.5px;align-items:baseline;width:100%;text-align:left;background:none;border-left:0;
    border-right:0;border-top:0;color:inherit;font-family:inherit;min-height:34px;}
  .hs-item:last-child{border-bottom:0;}
  .hs-item:hover,.hs-item.kb{background:#151922;}
  .hs-item[aria-selected="true"]{background:rgba(76,141,255,.12);}
  .hs-item .code{color:var(--acc);font-variant-numeric:tabular-nums;min-width:64px;font-weight:600;flex:0 0 auto;}
  .hs-item .name{color:var(--txt);opacity:.92;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hs-item .tag-hot{flex:0 0 auto;font-size:10.5px;line-height:1;padding:3px 6px;border-radius:4px;
    background:rgba(224,163,58,.16);color:var(--gold);border:1px solid rgba(224,163,58,.35);white-space:nowrap;}
  .hs-item .tag-cat{font-size:10.5px;line-height:1;padding:3px 6px;border-radius:4px;
    background:#1b2029;color:#7d8798;border:1px solid #232935;white-space:nowrap;}
  .hs-empty{padding:12px;color:var(--sub);font-size:12.5px;}

  /* ---------- 结果 ---------- */
  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .kpi div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
  .kpi .lab{font-size:11.5px;color:var(--sub);}
  .kpi .val{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;word-break:break-all;}
  .kpi .val.acc{color:var(--acc);}
  .kpi .val.ok{color:var(--ok);}
  .kpi .val.bad{color:var(--bad);}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    padding:7px 0;border-bottom:1px dashed rgba(255,255,255,.05);font-size:13.5px;}
  .row:last-child{border-bottom:0;}
  .row .k{color:var(--sub);}
  .row .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap;}
  .row.sub .v{font-weight:500;color:#c6cede;}
  .row.total{border-top:1px solid var(--line);border-bottom:0;margin-top:6px;padding-top:12px;font-size:15px;}
  .row.total .v{color:var(--acc);font-size:18px;}
  .row.profit .v{color:var(--ok);}
  .row.loss .v{color:var(--bad);}
  .bar{height:8px;border-radius:4px;background:#0d1014;overflow:hidden;display:flex;margin:10px 0 4px;}
  .bar i{display:block;height:100%;}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);}
  .legend s{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;text-decoration:none;}
  .formula{font-size:11px;color:#7d8798;line-height:1.65;margin-top:10px;
    border-top:1px dashed var(--line);padding-top:9px;}
  details.formula-box{margin-top:12px;}
  details.formula-box summary{cursor:pointer;font-size:11.5px;color:var(--sub);}
  .stale{color:var(--gold);}
  .row.head{border:0;margin:12px 0 2px;padding:0 0 4px;font-size:11.5px;letter-spacing:1px;
    color:var(--acc);font-weight:600;border-bottom:1px solid rgba(76,141,255,.25);}
  .row.head .v{display:none;}
  .row.head:first-child{margin-top:0;}
  .row.bad-head{color:#ff9b90;border-bottom-color:rgba(231,76,60,.4);}

  /* ---------- 报价单 ---------- */
  #printHint{padding:0 24px;color:var(--sub);font-size:12px;max-width:1560px;margin:0 auto;}
  #sheetWrap{padding:8px 24px 40px;max-width:1560px;margin:0 auto;}
  .sheet{background:#fff;color:#1a1a1a;border-radius:10px;padding:34px 38px;max-width:900px;margin:0 auto;
    box-shadow:0 8px 30px rgba(0,0,0,.4);}
  .sheet h3{margin:0 0 4px;font-size:20px;letter-spacing:1px;text-align:center;}
  .sheet .sub-line{text-align:center;font-size:12px;color:#666;margin-bottom:16px;}
  .sheet .meta{font-size:12px;color:#444;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px 22px;}
  .sheet table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:14px;}
  .sheet th,.sheet td{border:1px solid #ddd;padding:7px 8px;text-align:left;vertical-align:top;}
  .sheet thead th{background:#f2f4f7;font-weight:600;color:#333;white-space:nowrap;}
  .sheet tbody td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .sheet tfoot td{background:#fafbfc;font-weight:600;}
  .sheet .kv td:first-child{width:30%;background:#f8f9fb;color:#555;font-weight:500;}
  .sheet .big{font-size:15px;font-weight:700;color:#0b5fd6;}
  .sheet .terms-box{font-size:11.5px;color:#555;background:#f7f8fa;border:1px solid #e6e8ec;
    border-radius:6px;padding:9px 11px;margin-bottom:12px;line-height:1.7;}
  .sheet .foot{font-size:11px;color:#777;border-top:1px dashed #ccc;padding-top:10px;margin-top:14px;line-height:1.7;}
  .sheet .sign{margin-top:26px;display:flex;justify-content:space-between;gap:20px;font-size:12px;color:#555;flex-wrap:wrap;}
  .sheet .expired{color:#c0392b;font-weight:700;}

  /* ---------- 弹窗 ---------- */
  dialog{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:12px;
    padding:0;max-width:560px;width:calc(100% - 32px);box-shadow:0 20px 60px rgba(0,0,0,.6);}
  dialog::backdrop{background:rgba(0,0,0,.62);}
  .dlg-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);}
  .dlg-head h3{margin:0;font-size:15px;font-weight:600;}
  .dlg-head button{margin-left:auto;}
  .dlg-body{padding:16px 18px;max-height:min(62vh,520px);overflow:auto;}
  .dlg-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;}
  .list-item{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.06);}
  .list-item:last-child{border-bottom:0;}
  .list-item .li-main{flex:1 1 auto;min-width:0;}
  .list-item .li-t{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .list-item .li-s{font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums;}
  .empty{padding:18px 0;text-align:center;color:var(--sub);font-size:12.5px;}

  /* ---------- 移动端：明细转卡片 ---------- */
  @media(max-width:760px){
    header{padding:14px 14px 12px;}
    header h1{font-size:17px;}
    .toolbar{width:100%;margin-left:0;}
    .toolbar button{flex:1 1 auto;}
    #warnBar{margin:10px 14px 0;}
    main{padding:12px 14px 8px;gap:14px;}
    .panel{padding:14px;}
    .grid,.grid.g3,.grid.g4{grid-template-columns:1fr 1fr;}
    .grid .full{grid-column:1/-1;}
    .kpi{grid-template-columns:1fr 1fr;}
    .lines-wrap{border:0;background:none;overflow:visible;}
    table.lines{min-width:0;display:block;}
    table.lines thead{display:none;}
    table.lines tbody,table.lines tr,table.lines td{display:block;width:auto;}
    table.lines tr{background:#0d1014;border:1px solid var(--line);border-radius:8px;
      padding:10px;margin-bottom:10px;position:relative;display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;}
    table.lines td{border:0;padding:0;min-width:0;}
    table.lines td[data-label]::before{content:attr(data-label);display:block;font-size:10.5px;
      color:var(--sub);margin-bottom:2px;}
    table.lines td.c-idx{display:none;}
    table.lines td.c-prod,table.lines td.c-hs,table.lines td.c-sub{grid-column:1/-1;}
    table.lines td.c-sub{text-align:left;padding-right:0;font-size:13px;}
    table.lines td.c-sub::after{content:"";}
    table.lines td.c-act{position:absolute;top:6px;right:6px;width:auto;}
    .hs-bar input[type="search"]{flex:1 1 100%;}
    .hs-bar select{max-width:none;flex:1 1 46%;}
    #sheetWrap{padding:8px 14px 30px;}
    .sheet{padding:20px 16px;border-radius:8px;}
    .sheet .meta{gap:4px 14px;}
    .sheet table{font-size:11px;}
    .sheet th,.sheet td{padding:5px 5px;}
    .dlg-foot{flex-wrap:wrap;}
    .list-item{flex-wrap:wrap;}
  }
  @media print{
    body{background:#fff;}
    header,#warnBar,main,#printHint,dialog{display:none !important;}
    #sheetWrap{padding:0;max-width:none;}
    .sheet{box-shadow:none;padding:0;max-width:none;border-radius:0;}
    .sheet table{page-break-inside:auto;}
    .sheet tr{page-break-inside:avoid;}
    @page{size:A4;margin:12mm;}
  }

  /* ---------- 补充 ---------- */
  label.chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--txt);
    margin:0;cursor:pointer;font-weight:400;}
  label.chk input[type="checkbox"]{flex:0 0 auto;margin:0;}
  input.bad,table.lines input.bad{border-color:var(--bad);background:rgba(231,76,60,.09);}
  button.primary.danger{background:var(--bad);border-color:var(--bad);color:#fff;}
  button.primary.danger:hover{background:#d43f2f;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  #printHint{margin-top:6px;}
  @media(max-width:760px){#printHint{padding:0 14px;}}
  @media print{label.chk{display:none;}}
  @media(prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}

/* ===== v3.2 窄屏兜底
   fieldset 默认 min-width:min-content 会被内部表格撑破，必须归零 ===== */
/* 防 grid/flex 子项被内容撑破 */
fieldset{min-width:0;}
main>section,main>div{min-width:0;}
.inline{min-width:0;}
.grid>div{min-width:0;}
@media(max-width:760px){
  .lines-wrap{overflow-x:auto;}
  .toolbar button,.toolbar select{flex:0 1 auto;white-space:nowrap;}
}
@media(max-width:430px){
  .grid,.grid.g3,.grid.g4{grid-template-columns:1fr;}
  .toolbar{gap:6px;}
  .toolbar button,.toolbar select{flex:1 1 calc(50% - 6px);}
}

/* ===== v3.3 汇率表（多币种） ===== */
.fx-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 10px;}
.fx-item{display:flex;align-items:center;gap:6px;min-width:0;}
.fx-code{flex:0 0 auto;font-size:11px;color:var(--acc);font-weight:600;letter-spacing:.5px;width:34px;}
.fx-item input{padding:6px 8px;font-size:13px;}
#fxStamp{font-size:11px;color:var(--sub);}
#fxStamp.on{color:var(--ok,#3fb950);}
#fxStamp.err{color:var(--bad);}
@media(max-width:760px){.fx-grid{grid-template-columns:1fr 1fr;}}

/* ===== v3.3 窄屏大额本币兜底：报价单表格横向滚动，页面不溢出 ===== */
@media(max-width:760px){
  #sheetWrap{padding:8px 12px 30px;}
  .sheet{padding:22px 16px;overflow-x:auto;}
  .sheet table{min-width:520px;}
}
@media print{
  .sheet{overflow:visible;}
  .sheet table{min-width:0;}
}

/* ===== v3.3 在线汇率过期提示 ===== */
#fxStamp.stale{color:#e8b64c;}

/* ===== v3.4 抬头 / 地址 / 大写 / 装柜 ===== */
.sheet .sh-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:8px;}
.sheet .sh-logo img{max-width:180px;max-height:70px;object-fit:contain;display:block;}
.sheet .sh-logo .ph{display:none;}
.sheet .sh-seller{font-size:11.5px;line-height:1.55;color:#3a4453;text-align:right;max-width:58%;}
.sheet .sh-seller strong{font-size:13px;color:#1c2430;display:block;margin-bottom:2px;}
.sheet .kv .addr{font-size:11px;color:#5a6373;margin-top:3px;line-height:1.45;}
.sheet .say-box{margin-top:2px;margin-bottom:12px;font-size:12px;line-height:1.6;background:#f7f9fc;
  border:1px dashed #cfd8e6;border-radius:6px;padding:7px 10px;color:#1f2b3d;word-break:break-word;}
.sheet .say-box .lab{font-weight:600;color:#2b3a55;}
.sheet .ship-line{margin:-4px 0 12px;font-size:11.5px;color:#33415c;}
.hint.dim{opacity:.55;}
#logoPrev{max-width:180px;max-height:70px;object-fit:contain;margin-top:8px;background:#fff;
  border:1px solid #e3e8f0;border-radius:4px;padding:2px;}
@media print{
  .sheet .sh-top{display:flex !important;}
  .sheet .say-box{background:#fff;border-color:#bbb;}
}


  /* ========== v3.5 A+B：简易模式 / 大字号档 ========== */
  #simpleCard{display:none;}
  body[data-mode="simple"] #simpleCard{display:block;}
  body[data-mode="simple"] #inputPanel{display:none;}
  body[data-mode="simple"] #inputPanel.open{display:block;margin-top:18px;}
  /* 简易模式只保留「保存」「模式切换」两个工具栏按钮，其余隐藏 */
  body[data-mode="simple"] .toolbar button:not(#btnSave):not(#btnMode){display:none;}

  #simpleCard h2{font-size:16px;color:var(--txt);letter-spacing:0;}
  .simple-lead{font-size:13px;color:var(--sub);margin:-2px 0 16px;line-height:1.6;}
  .simple-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px;}
  .simple-grid .full{grid-column:1/-1;}
  #simpleCard label{font-size:14px;color:var(--txt);margin-bottom:7px;letter-spacing:.3px;}
  #simpleCard input,#simpleCard select{font-size:17px;padding:12px 13px;min-height:50px;border-radius:8px;}
  #simpleCard input.num{text-align:right;font-variant-numeric:tabular-nums;}
  .simple-actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;}
  button.big{font-size:16.5px;min-height:54px;padding:13px 22px;flex:1 1 210px;border-radius:9px;font-weight:600;}
  button.big.primary{box-shadow:0 4px 14px rgba(76,141,255,.25);}
  #simpleHint{margin-top:12px;font-size:12.5px;}
  @media(max-width:560px){.simple-grid{grid-template-columns:1fr;}}

  /* 字号档：整页等比缩放（窄屏不缩放，避免横向溢出；打印保持原尺寸） */
  body[data-fs="115"]{zoom:1.15;}
  body[data-fs="130"]{zoom:1.30;}
  body[data-fs="115"] button,body[data-fs="130"] button{min-height:44px;font-size:14.5px;}
  body[data-fs="115"] button.mini,body[data-fs="130"] button.mini{min-height:34px;font-size:13px;}
  body[data-fs="115"] input,body[data-fs="130"] input,
  body[data-fs="115"] select,body[data-fs="130"] select,
  body[data-fs="115"] textarea,body[data-fs="130"] textarea{min-height:42px;font-size:15px;}
  body[data-fs="115"] label,body[data-fs="130"] label{font-size:13.5px;}
  body[data-fs="115"] .hint,body[data-fs="130"] .hint{font-size:13px;}
  @media(max-width:820px){body[data-fs="115"],body[data-fs="130"]{zoom:1;}}
  @media print{body[data-fs]{zoom:1 !important;} #simpleCard{display:none !important;}}


  /* ========== v3.6 简易模式结果条 ========== */
  .simple-result{margin-top:20px;padding:16px 18px;border-radius:10px;
    background:linear-gradient(180deg,rgba(76,141,255,.10),rgba(76,141,255,.03));
    border:1px solid rgba(76,141,255,.32);}
  .sr-row{display:flex;gap:18px;flex-wrap:wrap;}
  .sr-cell{flex:1 1 180px;min-width:0;}
  .sr-lab{display:block;font-size:13px;color:var(--sub);margin-bottom:4px;letter-spacing:.3px;}
  .sr-cell b{display:block;font-size:26px;font-weight:700;color:#9dc0ff;line-height:1.2;
    font-variant-numeric:tabular-nums;word-break:break-all;}
  .sr-cell:last-child b{color:#7ee2a8;}
  .sr-basis{margin-top:12px;padding-top:11px;border-top:1px dotted rgba(255,255,255,.13);
    font-size:12.5px;color:var(--sub);line-height:1.6;}
  .sr-warn{margin-top:10px;padding:9px 12px;border-radius:7px;font-size:13.5px;
    background:rgba(242,176,30,.10);border:1px solid rgba(242,176,30,.42);color:#f6d18a;}
  .simple-result.invalid{border-color:rgba(242,176,30,.5);background:rgba(242,176,30,.06);}
  .simple-result.invalid .sr-cell b{color:#f6d18a;}
  @media(max-width:560px){
    .sr-cell b{font-size:23px;}
    .sr-row{gap:12px;}
    .sr-cell{flex:1 1 100%;}
  }

  /* ========== v3.7 每件毛利与利润预警 ========== */
  .sr-sub{display:block;margin-top:5px;font-size:13.5px;color:var(--sub);font-variant-numeric:tabular-nums;}
  .simple-result .sr-cell b.neg{color:#ff8f8f;}
  .sr-warn.bad{background:rgba(240,71,71,.13);border-color:rgba(240,71,71,.48);color:#ffb3b3;}
  .sr-warn.low{background:rgba(242,176,30,.10);border-color:rgba(242,176,30,.44);color:#f6d18a;}


  /* ========== v3.8 目标价倒算 / 历史价对比 / 客户短句 ========== */
  .sr-tools{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;}
  .sr-linkbtn{font-size:13px;color:#8fb4ff;text-decoration:none;cursor:pointer;
    border-bottom:1px dashed rgba(143,180,255,.55);padding-bottom:2px;outline-offset:3px;}
  .sr-linkbtn:hover,.sr-linkbtn:focus-visible{color:#c0d4ff;border-bottom-color:#c0d4ff;}
  .sr-target{margin-top:12px;padding:13px 14px;border-radius:8px;display:flex;gap:14px;flex-wrap:wrap;
    align-items:flex-end;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.11);}
  .sr-target[hidden],.sr-hist[hidden]{display:none;}
  .sr-target>div{flex:1 1 150px;min-width:0;}
  .sr-target>div.sr-target-out{flex:1 1 100%;}
  .sr-target label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:5px;}
  .sr-target input{width:100%;box-sizing:border-box;}
  .sr-target-out{font-size:13px;line-height:1.7;color:var(--sub);font-variant-numeric:tabular-nums;}
  .sr-target-out.low{color:#f6d18a;}
  .sr-target-out.bad{color:#ffb3b3;}
  .sr-hist{margin-top:11px;font-size:12.5px;color:var(--sub);line-height:1.6;}
  .sr-hist.up{color:#f6d18a;}
  @media(max-width:560px){.sr-tools{gap:12px;} .sr-target>div{flex:1 1 100%;}}


  /* ========== v3.9 数量阶梯报价 ========== */
  .sr-tiers{margin-top:12px;padding:13px 14px;border-radius:8px;
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.11);}
  .sr-tiers[hidden]{display:none;}
  .sr-tiers-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
  .sr-tiers-head b{font-size:13.5px;color:#cfd8e6;font-weight:600;}
  .sr-tiers-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .sr-tier-table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;min-width:430px;}
  .sr-tier-table th{font-size:12px;font-weight:500;color:var(--sub);text-align:right;padding:6px 8px;
    border-bottom:1px solid rgba(255,255,255,.12);white-space:nowrap;}
  .sr-tier-table th:first-child{text-align:left;}
  .sr-tier-table td{text-align:right;padding:7px 8px;border-bottom:1px dotted rgba(255,255,255,.08);white-space:nowrap;}
  .sr-tier-table td:first-child{text-align:left;color:#cfd8e6;}
  .sr-tier-table tr.cur td{background:rgba(143,180,255,.10);}
  .sr-tier-table tr.cur td:first-child{box-shadow:inset 2px 0 0 #8fb4ff;color:#c0d4ff;}
  .sr-tier-table .t-margin{color:#7ee2a8;}
  .sr-tier-table .t-margin.low{color:#f6d18a;}
  .sr-tier-table .t-margin.bad{color:#ff8f8f;}
  .sr-tiers-swipe{display:none;font-size:11.5px;color:var(--sub);text-align:center;padding:2px 0 4px;}
  @media (max-width:520px){ .sr-tiers-swipe{display:block;} .sr-tier-table{font-size:12px;} .sr-tier-table th,.sr-tier-table td{padding-left:6px;padding-right:6px;} }
  .sr-tier-table .t-gp{color:#c0d4ff;}
  .sr-tier-table .t-delta{display:block;font-size:11.5px;color:var(--sub);margin-top:2px;}
  .sr-tier-table .t-tag{font-size:11px;color:#8fb4ff;margin-left:6px;}
  .sr-tiers-note{margin-top:9px;font-size:12px;line-height:1.65;color:var(--sub);}
  .sr-tiers-note.flat{color:#f6d18a;}
  @media(max-width:560px){
    .sr-tier-table{min-width:400px;font-size:12.5px;}
    .sr-tiers{padding:11px 11px;}
  }

/* ===== v3.10 多客户批量比价 ===== */
.sr-cust{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;}
.sr-cust .sr-tiers-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.sr-cust .sr-tiers-head b{font-size:12.5px;color:var(--acc);}
.sc-links{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.sc-links .primary-link{color:var(--ok);font-weight:600;}
.sr-cust-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.sc-card{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--panel2);min-width:0;}
.sc-head{display:flex;align-items:center;gap:8px;min-width:0;}
.sc-head b{flex:0 0 18px;font-size:11px;color:var(--sub);text-align:center;}
.sc-name{flex:1 1 auto;min-width:0;padding:6px 8px;font-size:13px;}
.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;margin-top:6px;}
.sc-grid label{display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--sub);min-width:0;}
.sc-grid select,.sc-grid input{padding:5px 7px;font-size:12.5px;min-width:0;width:100%;}
.sc-wide{grid-column:1 / -1;}
.sc-foot{margin-top:6px;text-align:right;}
.sc-foot .sr-linkbtn{font-size:11.5px;}
.sr-cust-addwrap{margin-top:8px;}
.sr-cust .sr-tiers-wrap{margin-top:8px;}
#srCustTable th{white-space:nowrap;}
#srCustTable td{white-space:nowrap;font-size:12px;}
#srCustTable td.sc-nm{max-width:150px;overflow:hidden;text-overflow:ellipsis;}
#srCustBody tr.bad td{color:var(--bad);}
#srCustBody tr.cur td{background:rgba(76,141,255,.07);}
#srCustBody tr.thin td{background:rgba(242,176,30,.07);}
.sc-tag.thin{border-color:var(--warn);color:var(--warn);}
#srCustBody td.sc-down{color:var(--gold);}
#srCustBody td.sc-up{color:var(--ok);}
.sc-tag{margin-left:5px;padding:0 4px;border:1px solid var(--bad);border-radius:4px;font-size:9.5px;color:var(--bad);}
.sr-cust .sr-tiers-note.dim{color:var(--sub);}
@media(max-width:760px){
  .sr-cust-list{grid-template-columns:1fr;}
}
/* 多页打印区：屏幕不显示，打印时替换主报价单 */
#sheetMulti{display:none;}
@media print{
  body.print-multi #sheet{display:none !important;}
  body.print-multi #sheetMulti{display:block !important;}
  #sheetMulti .msheet{max-width:none;box-shadow:none;border-radius:0;padding:0;}
  #sheetMulti .msheet{page-break-after:always;break-after:page;page-break-inside:auto;}
  #sheetMulti .msheet:last-child{page-break-after:auto;break-after:auto;}
}

</style>
</head>
<body>
<header>
  <h1 data-i18n="title">中亚出口报价核算器</h1>
  <span class="sub" data-i18n="subtitle"></span>
  <div class="toolbar">
    <button id="btnSave" type="button" data-i18n="btnSave"></button>
    <button id="btnLoad" type="button" data-i18n="btnLoad"></button>
    <button id="btnHistory" type="button" data-i18n="btnHistory"></button>
    <button id="btnExport" type="button" data-i18n="btnExport"></button>
    <button id="btnImport" type="button" data-i18n="btnImport"></button>
    <button id="btnCopy" type="button" data-i18n="btnCopy"></button>
    <button id="btnCsv" type="button" data-i18n="btnCsv"></button>
    <button id="btnPrint" type="button" class="primary" data-i18n="btnPrint"></button>
    <select id="fontScale" class="lang" aria-label="字号 / Размер шрифта">
      <option value="100">100%</option>
      <option value="115">115%</option>
      <option value="130">130%</option>
    </select>
    <button id="btnMode" type="button"></button>
    <select id="lang" class="lang" aria-label="语言 / Язык">
      <option value="zh">中文</option>
      <option value="ru">Русский</option>
    </select>
  </div>
  <input type="file" id="fileInput" accept=".json,application/json" aria-label="导入 JSON 报价方案" hidden>
</header>

<div id="warnBar" role="status" aria-live="polite"></div>

<main>
  <section id="simpleCard" class="panel" aria-labelledby="hSimple">
    <h2 id="hSimple" data-i18n="simpleTitle"></h2>
    <p class="simple-lead" data-i18n="simpleLead"></p>
    <div class="simple-grid">
      <div>
        <label for="sCountry" data-i18n="destCountry"></label>
        <select id="sCountry"></select>
      </div>
      <div>
        <label for="sTerms" data-i18n="termsLabel"></label>
        <select id="sTerms">
          <option value="FOB" data-i18n="termFob"></option>
          <option value="CFR" data-i18n="termCfr"></option>
          <option value="CIF" data-i18n="termCif"></option>
          <option value="DDP" data-i18n="termDdp"></option>
        </select>
      </div>
      <div class="full">
        <label for="sProduct" data-i18n="colProduct"></label>
        <input id="sProduct" class="text" autocomplete="off" spellcheck="false" data-i18n-placeholder="phProductSimple">
      </div>
      <div>
        <label for="sQty" data-i18n="colQty"></label>
        <input id="sQty" type="text" inputmode="decimal" autocomplete="off" class="num">
      </div>
      <div>
        <label for="sPrice" class="price" data-i18n="simplePrice"></label>
        <input id="sPrice" type="text" inputmode="decimal" autocomplete="off" class="num">
      </div>
      <div>
        <label for="sProfit" data-i18n="simpleProfit"></label>
        <input id="sProfit" type="text" inputmode="decimal" autocomplete="off" class="num">
      </div>
    </div>
    <div id="simpleResult" class="simple-result">
      <div class="sr-row">
        <div class="sr-cell">
          <span class="sr-lab" data-i18n="srUnitPrice"></span>
          <b id="srUnit">&mdash;</b>
        </div>
        <div class="sr-cell">
          <span class="sr-lab" data-i18n="srTotal"></span>
          <b id="srTotal">&mdash;</b>
        </div>
        <div class="sr-cell">
          <span class="sr-lab" data-i18n="srMarginLab"></span>
          <b id="srMargin">&mdash;</b>
          <span class="sr-sub" id="srMarginPct"></span>
        </div>
      </div>
      <div class="sr-basis" id="srBasis"></div>
      <div class="sr-warn" id="srWarn" hidden></div>
      <div class="sr-tools">
        <a class="sr-linkbtn" id="srTargetToggle" href="javascript:void(0)" role="button" aria-expanded="false" data-i18n="srTargetToggle"></a>
        <a class="sr-linkbtn" id="srTierToggle" href="javascript:void(0)" role="button" aria-expanded="false" data-i18n="srTierToggle"></a>
        <a class="sr-linkbtn" id="srCustToggle" href="javascript:void(0)" role="button" aria-expanded="false" data-i18n="srCustToggle"></a>
        <a class="sr-linkbtn" id="srShare" href="javascript:void(0)" role="button" data-i18n="srShare"></a>
      </div>
      <div class="sr-target" id="srTargetBox" hidden>
        <div>
          <label for="srTargetPrice" data-i18n="srTargetPrice"></label>
          <input id="srTargetPrice" type="text" inputmode="decimal" autocomplete="off" class="num">
        </div>
        <div>
          <label for="srTargetMargin" data-i18n="srTargetMargin"></label>
          <input id="srTargetMargin" type="text" inputmode="decimal" autocomplete="off" class="num">
        </div>
        <div class="sr-target-out" id="srTargetOut"></div>
      </div>
      <div class="sr-tiers" id="srTierBox" hidden>
        <div class="sr-tiers-head">
          <b id="srTierTitle"></b>
          <a class="sr-linkbtn" id="srTierCopy" href="javascript:void(0)" role="button" data-i18n="srTierCopy"></a>
        </div>
        <div class="sr-tiers-wrap">
          <table class="sr-tier-table">
            <thead>
              <tr>
                <th data-i18n="srTierQty"></th>
                <th data-i18n="srTierUnit"></th>
                <th data-i18n="srTierTotal"></th>
                <th data-i18n="srTierProfit"></th>
                <th data-i18n="srTierGp"></th>
                <th data-i18n="srTierMargin"></th>
              </tr>
            </thead>
            <tbody id="srTierBody"></tbody>
          </table>
        </div>
        <div class="sr-tiers-swipe" data-i18n="srTierSwipe"></div>
        <div class="sr-tiers-note" id="srTierNote"></div>
      </div>
      <div class="sr-cust" id="srCustBox" hidden>
        <div class="sr-tiers-head">
          <b id="srCustTitle"></b>
          <span class="sc-links">
            <a class="sr-linkbtn" id="srCustCopy" href="javascript:void(0)" role="button" data-i18n="srCustCopy"></a>
            <a class="sr-linkbtn primary-link" id="srCustPrint" href="javascript:void(0)" role="button" data-i18n="srCustPrint"></a>
          </span>
        </div>
        <div class="sr-cust-list" id="srCustList"></div>
        <div class="sr-cust-addwrap">
          <button type="button" id="srCustAdd" class="mini" data-i18n="srCustAdd"></button>
        </div>
        <div class="sr-tiers-wrap">
          <table class="sr-tier-table" id="srCustTable">
            <thead>
              <tr>
                <th data-i18n="srCustName"></th>
                <th data-i18n="srCustCond"></th>
                <th data-i18n="srCustCcy"></th>
                <th data-i18n="srCustUnit"></th>
                <th data-i18n="srCustTotal"></th>
                <th data-i18n="srCustGp"></th>
                <th data-i18n="srCustMargin"></th>
                <th data-i18n="srCustVs"></th>
              </tr>
            </thead>
            <tbody id="srCustBody"></tbody>
          </table>
        </div>
        <div class="sr-tiers-swipe" data-i18n="srCustSwipe"></div>
        <div class="sr-tiers-note" id="srCustNote"></div>
      </div>
      <div class="sr-hist" id="srHist" hidden></div>
    </div>

    <div class="simple-actions">
      <button id="btnSimplePrint" type="button" class="primary big" data-i18n="simplePrint"></button>
      <button id="btnSimplePro" type="button" class="big" data-i18n="simpleOpenPro"></button>
    </div>
    <div class="hint" id="simpleHint"></div>
  </section>

  <section class="panel" id="inputPanel" aria-labelledby="hInput">
    <h2 id="hInput" data-i18n="inputTitle"></h2>

    <fieldset>
      <legend data-i18n="secMeta"></legend>
      <div class="grid g3">
        <div>
          <label for="offerNo" data-i18n="metaOfferNo"></label>
          <div class="inline">
            <input id="offerNo" autocomplete="off" spellcheck="false">
            <button id="btnRegen" type="button" class="mini" data-i18n="regen"></button>
          </div>
        </div>
        <div>
          <label for="offerDate" data-i18n="metaDate"></label>
          <input id="offerDate" type="date">
        </div>
        <div>
          <label for="validDays" data-i18n="validDays"></label>
          <div class="inline">
            <select id="validDays">
              <option value="7" data-i18n="v7"></option>
              <option value="15" data-i18n="v15"></option>
              <option value="30" data-i18n="v30"></option>
              <option value="60" data-i18n="v60"></option>
              <option value="custom" data-i18n="vCustom"></option>
            </select>
            <input id="validCustom" type="text" inputmode="decimal" autocomplete="off" style="max-width:76px" aria-label="custom days">
          </div>
          <div class="hint" id="validHint"></div>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend data-i18n="secItems"></legend>
      <div class="lines-wrap">
        <table class="lines" id="linesTable">
          <thead>
            <tr>
              <th class="c-idx" data-i18n="colIdx"></th>
              <th class="c-prod" data-i18n="colProduct"></th>
              <th class="c-hs" data-i18n="colHs"></th>
              <th class="c-qty" data-i18n="colQty"></th>
              <th class="c-unit" data-i18n="colUnit"></th>
              <th class="c-price" data-i18n="colPrice"></th>
              <th class="c-rate" data-i18n="colVatIn"></th>
              <th class="c-rate" data-i18n="colRefund"></th>
              <th class="c-rate" data-i18n="colDuty"></th>
              <th class="c-rate" data-i18n="colVat"></th>
              <th class="c-sub" data-i18n="colSubtotal"></th>
              <th class="c-act" aria-label="row actions"></th>
            </tr>
          </thead>
          <tbody id="lineBody"></tbody>
        </table>
      </div>
      <div class="lines-foot">
        <div class="inline">
          <button id="btnAddLine" type="button" data-i18n="addLine"></button>
          <span class="tag" id="lineLimit"></span>
        </div>
        <div class="lines-sum" id="linesSum"></div>
      </div>
      <div class="hint" data-i18n="lineHint"></div>
    </fieldset>

    <fieldset>
      <legend data-i18n="secHs"></legend>
      <div class="hs-box">
        <div class="hs-bar">
          <input type="search" id="hsSearch" autocomplete="off" aria-label="HS search">
          <select id="hsCat" aria-label="category"></select>
          <label class="chk"><input type="checkbox" id="onlyHot"><span data-i18n="onlyHot"></span></label>
        </div>
        <div class="hs-meta">
          <span id="hsCount"></span>
          <span id="hsTarget"></span>
        </div>
        <div class="hs-list" id="hsList" role="listbox" tabindex="0" aria-label="HS list"></div>
        <div class="hs-meta">
          <span class="hint" data-i18n="hsPickHint"></span>
          <button id="btnMoreHs" type="button" class="mini" data-i18n="loadMore"></button>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend data-i18n="secCost"></legend>
      <div class="grid g4">
        <div><label for="feeDomestic" data-i18n="domesticFreight"></label>
          <input id="feeDomestic" type="text" inputmode="decimal" autocomplete="off" class="num"></div>
        <div><label for="feePacking" data-i18n="packingFee"></label>
          <input id="feePacking" type="text" inputmode="decimal" autocomplete="off" class="num"></div>
        <div><label for="feeCustoms" data-i18n="customsFee"></label>
          <input id="feeCustoms" type="text" inputmode="decimal" autocomplete="off" class="num"></div>
        <div><label for="feeOther" data-i18n="otherFee"></label>
          <input id="feeOther" type="text" inputmode="decimal" autocomplete="off" class="num"></div>
      </div>

<script>
/* ============================================================
   中亚出口报价核算器 v3 — 计算内核 / 状态 / 渲染
   ============================================================ */

let lang = "zh";
function t(k) {
  const dict = I18N[lang] || I18N.zh;
  if (dict && dict[k] != null) return dict[k];
  return I18N.zh && I18N.zh[k] != null ? I18N.zh[k] : k;
}

/* ---------------- 工具 ---------------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const n0 = v => (v == null || v === "" || isNaN(v) ? 0 : Number(v));

function toNum(raw, def) {
  if (raw == null) return def;
  let s = String(raw).trim();
  if (s === "") return def;
  s = s.replace(/[\s\u00a0'']/g, "").replace(/[¥$€₸₽]/g, "").replace(/，/g, ",");
  if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, "");
  else if (/^-?\d+,\d+$/.test(s)) s = s.replace(",", ".");
  const n = parseFloat(s);
  return isFinite(n) ? n : def;
}
function fmt(n, dec = 2) {
  if (!isFinite(n)) n = 0;
  return Number(n).toLocaleString(lang === "ru" ? "ru-RU" : "zh-CN", { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
const pct = (x, dec = 1) => fmt((isFinite(x) ? x : 0) * 100, dec) + "%";

/* ---------------- 常量 ---------------- */
const CATS = (() => { const seen = []; HS_DB.forEach(x => { if (seen.indexOf(x.cat) < 0) seen.push(x.cat); }); return seen; })();
const COUNTRY = {
  KZ: { duty: 5, vat: 12 }, UZ: { duty: 5, vat: 12 }, KG: { duty: 5, vat: 12 },
  RU: { duty: 5, vat: 20 }, TJ: { duty: 0, vat: 0 }, TM: { duty: 0, vat: 0 }, CUSTOM: { duty: 0, vat: 0 }
};
const FX_FALLBACK = 7.15;
/* 多币种：1 单位外币 = ? CNY（CNY 恒为 1） */
const CCY_META = {
  USD: { dec: 2, sym: "$",     zh: "美元",   ru: "долл. США" },
  CNY: { dec: 2, sym: "¥",     zh: "人民币", ru: "юань" },
  KZT: { dec: 0, sym: "₸",     zh: "坚戈",   ru: "тенге" },
  UZS: { dec: 0, sym: "soʻm ", zh: "苏姆",   ru: "сум" },
  RUB: { dec: 2, sym: "₽",     zh: "卢布",   ru: "руб." }
};
const CCY_LIST = ["USD", "CNY", "KZT", "UZS", "RUB"];
const FX_LOCAL = ["RUB", "KZT", "UZS"];
const FX_BOOK_DEF = { USD: FX_FALLBACK, RUB: 0.088, KZT: 0.0138, UZS: 0.00057 };
const MAX_LINES = 20;
const HS_PAGE = 60;
const SCHEMA = 3;
const MEM = { rate: "ca_rates_v3", plans: "ca_plans_v3", hist: "ca_hist_v3", draft: "ca_draft_v3", no: "ca_no_v3", lang: "ca_lang_v3", logo: "ca_logo_v3" };
/* 常用柜型：容积 m³ / 限重 kg */
const CONTAINERS = [
  { k: "20GP", cbm: 28, kg: 21700 },
  { k: "40GP", cbm: 58, kg: 26000 },
  { k: "40HQ", cbm: 68, kg: 26000 }
];
const TERMS = ["FOB", "CFR", "CIF", "DDP"];

/* ---------------- 状态 ---------------- */
function todayStr() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function addDays(dateStr, days) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr || "")) return "";
  const d = new Date(dateStr + "T00:00:00");
  if (isNaN(d.getTime())) return "";
  d.setDate(d.getDate() + Number(days || 0));
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
let uidSeq = 0;
const uid = () => "L" + (Date.now().toString(36)) + (uidSeq++).toString(36) + Math.random().toString(36).slice(2, 5);

const curCountry = () => (state && state.logi && COUNTRY[state.logi.country] ? state.logi.country : "KZ");
function newLine(o) {
  const c = COUNTRY[curCountry()] || COUNTRY.KZ;
  return Object.assign({
    id: uid(), product: "", hs: "", qty: 1, unit: t("unitDefault"),
    price: 0, vatIn: 13, refund: 13, duty: c.duty, vat: c.vat, rateSrc: "preset"
  }, o || {});
}
function defaultState() {
  return {
    schema: SCHEMA,
    meta: { no: "", date: todayStr(), validDays: "30", validCustom: 30 },
    lines: [newLine()],
    fees: { domestic: 0, packing: 0, customs: 0, other: 0 },

      gw: 0, vol: 0,
      fx: FX_FALLBACK, fxDate: todayStr(), fxSource: "builtin",
      fxBook: { RUB: FX_BOOK_DEF.RUB, KZT: FX_BOOK_DEF.KZT, UZS: FX_BOOK_DEF.UZS },
      fxMeta: { src: "manual", at: "", provider: "" }

    price: { mode: "markup", profit: 20, ccy: "USD", vatDeduct: false },

let lastR = null;

/* ---------------- 持久化 ---------------- */
function lsGet(k, def) { try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function loadRates() { const m = lsGet(MEM.rate, {}); return m && typeof m === "object" ? m : {}; }
function saveRate(hs, country, obj) {
  if (!hs) return;
  const m = loadRates();
  m[hs + "|" + country] = obj;
  lsSet(MEM.rate, m);
}
function ratesFor(hs, country) {
  const m = loadRates(), k = hs + "|" + country;
  if (m[k]) return Object.assign({ vatIn: 13, refund: 13 }, m[k], { src: "memory" });
  const p = COUNTRY[country] || COUNTRY.CUSTOM;
  return { duty: p.duty, vat: p.vat, vatIn: 13, refund: 13, src: "preset" };
}
function loadNo() {
  let no = localStorage.getItem(MEM.no);
  if (!no || !/^QY-\d{8}-\d{3}$/.test(no)) { no = genNo(); localStorage.setItem(MEM.no, no); }
  return no;
}
function genNo() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return "QY-" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + String(Math.floor(Math.random() * 900) + 100);
}

/* ---------------- 公司 Logo（本地保存，跨方案复用） ---------------- */
function logoData() {
  try { const v = localStorage.getItem(MEM.logo); return v && v.indexOf("data:image/") === 0 ? v : ""; } catch (e) { return ""; }
}
function saveLogo(dataUrl) {
  try {
    if (dataUrl) localStorage.setItem(MEM.logo, dataUrl);
    else localStorage.removeItem(MEM.logo);
    return true;
  } catch (e) { return false; }
}
/* 等比压缩到 ≤360×140，PNG 超限时转 JPEG，控制 localStorage 占用 */
function compressLogo(file, cb) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const maxW = 360, maxH = 140;
      let w = img.width || maxW, h = img.height || maxH;
      const s = Math.min(1, maxW / w, maxH / h);
      w = Math.max(1, Math.round(w * s)); h = Math.max(1, Math.round(h * s));
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      const ctx = cv.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      let out = "";
      try { out = cv.toDataURL("image/png"); } catch (e) { out = ""; }
      if (!out || out.length > 180000) {
        try { out = cv.toDataURL("image/jpeg", 0.85); } catch (e) { out = ""; }
      }
      cb(out && out.length <= 400000 ? out : "");
    };
    img.onerror = () => cb("");
    img.src = String(reader.result || "");
  };
  reader.onerror = () => cb("");
  reader.readAsDataURL(file);
}
function renderLogoUI() {
  const data = logoData();
  const img = $("logoPrev");
  if (!img) return;
  if (data) {
    img.src = data; img.hidden = false;
    /* 已设 Logo 时自动展开折叠区，让预览与「清除」按钮可见 */
    const fold = img.closest("details");
    if (fold) fold.open = true;
  } else { img.removeAttribute("src"); img.hidden = true; }
  const hint = $("logoHint");
  if (hint) { hint.textContent = data ? t("logoSet") : t("logoNone"); hint.className = "hint"; }
}

/* ---------------- 规范化（导入/载入/草稿统一入口） ---------------- */
function normLine(l, countryKey) {
  const ck = COUNTRY[countryKey] ? countryKey : curCountry();
  const d = newLine({ duty: (COUNTRY[ck] || COUNTRY.CUSTOM).duty, vat: (COUNTRY[ck] || COUNTRY.CUSTOM).vat });
  if (!l || typeof l !== "object") return d;
  const numOr = (v, def, lo, hi) => (v == null || v === "" ? def : clamp(toNum(v, def), lo, hi));
  return {
    id: typeof l.id === "string" && l.id ? l.id.slice(0, 40) : d.id,
    product: typeof l.product === "string" ? l.product.slice(0, 120) : "",
    hs: typeof l.hs === "string" ? l.hs.slice(0, 24) : "",
    qty: numOr(l.qty, 1, 0, 1e9),
    unit: typeof l.unit === "string" && l.unit ? l.unit.slice(0, 10) : t("unitDefault"),
    price: numOr(l.price, 0, 0, 1e12),
    vatIn: numOr(l.vatIn, 13, 0, 100),
    refund: numOr(l.refund, 13, 0, 100),
    duty: numOr(l.duty, (COUNTRY[ck] || COUNTRY.CUSTOM).duty, 0, 100),
    vat: numOr(l.vat, (COUNTRY[ck] || COUNTRY.CUSTOM).vat, 0, 100),
    rateSrc: ["preset", "memory", "manual"].indexOf(l.rateSrc) >= 0 ? l.rateSrc : "manual"
  };
}
function normalizeState(o) {
  const b = defaultState();
  if (!o || typeof o !== "object") return b;
  const m = o.meta || {};
  b.meta.no = typeof m.no === "string" && m.no.trim() ? m.no.trim().slice(0, 40) : b.meta.no;
  b.meta.date = /^\d{4}-\d{2}-\d{2}$/.test(m.date || "") ? m.date : todayStr();
  b.meta.validDays = ["7", "15", "30", "60", "custom"].indexOf(String(m.validDays)) >= 0 ? String(m.validDays) : "30";
  b.meta.validCustom = clamp(toNum(m.validCustom, 30), 1, 365);

  const f = o.fees || {};
  ["domestic", "packing", "customs", "other"].forEach(k => { b.fees[k] = clamp(toNum(f[k], 0), 0, 1e12); });

  const lg = o.logi || {};
  b.logi.country = COUNTRY[lg.country] ? lg.country : "CUSTOM";
  b.logi.terms = TERMS.indexOf(lg.terms) >= 0 ? lg.terms : "DDP";
  b.logi.freight = clamp(toNum(lg.freight, 0), 0, 1e12);
  b.logi.insRate = clamp(toNum(lg.insRate, 0.3), 0, 89.99);
  b.logi.clearance = clamp(toNum(lg.clearance, 0), 0, 1e12);
  b.logi.gw = clamp(toNum(lg.gw, 0), 0, 1e9);
  b.logi.vol = clamp(toNum(lg.vol, 0), 0, 1e7);
  b.logi.fx = toNum(lg.fx, 0);
  if (!(b.logi.fx > 0)) b.logi.fx = FX_FALLBACK;
  b.logi.fxDate = /^\d{4}-\d{2}-\d{2}$/.test(lg.fxDate || "") ? lg.fxDate : todayStr();
  b.logi.fxSource = ["builtin", "pboc", "bank", "customs", "manual"].indexOf(lg.fxSource) >= 0 ? lg.fxSource : "builtin";
  const fb = lg.fxBook || {};
  FX_LOCAL.forEach(c => { const v = toNum(fb[c], 0); b.logi.fxBook[c] = v > 0 ? v : FX_BOOK_DEF[c]; });
  const fm = lg.fxMeta || {};
  b.logi.fxMeta = {
    src: fm.src === "online" ? "online" : "manual",
    at: typeof fm.at === "string" ? fm.at.slice(0, 20) : "",
    provider: typeof fm.provider === "string" ? fm.provider.slice(0, 40) : ""
  };

  const pr = o.price || {};
  b.price.mode = pr.mode === "margin" ? "margin" : "markup";
  b.price.profit = clamp(toNum(pr.profit, 20), 0, 999);
  b.price.ccy = CCY_LIST.indexOf(pr.ccy) >= 0 ? pr.ccy : "USD";
  b.price.vatDeduct = !!pr.vatDeduct;

  const pt = o.party || {};
  const txt = (v, n) => (typeof v === "string" ? v.slice(0, n) : "");
  b.party.buyer = txt(pt.buyer, 80);
  b.party.seller = txt(pt.seller, 80);
  b.party.remark = txt(pt.remark, 500);
  b.party.buyerAddr = txt(pt.buyerAddr, 200);
  b.party.sellerAddr = txt(pt.sellerAddr, 200);
  b.party.sellerTel = txt(pt.sellerTel, 60);
  b.party.sellerMail = txt(pt.sellerMail, 80);
  b.party.sellerWeb = txt(pt.sellerWeb, 80);

  const dl = o.deal || {};
  ["pay", "lead", "packing", "origin", "moq"].forEach(k => { b.deal[k] = txt(dl[k], 120); });

  const cs = Array.isArray(o.customers) ? o.customers.slice(0, MAX_CUST) : [];
  b.customers = cs.map(c => normalizeCustomer(c));

  const lines = Array.isArray(o.lines) ? o.lines.slice(0, MAX_LINES) : [];
  b.lines = lines.length ? lines.map(x => normLine(x, b.logi.country)) : [newLine({ duty: (COUNTRY[b.logi.country] || COUNTRY.CUSTOM).duty, vat: (COUNTRY[b.logi.country] || COUNTRY.CUSTOM).vat })];
  b.activeLineId = b.lines[0].id;
  return b;
}

/* ---------------- 计算内核 ---------------- */
function fxNow() { return state.logi.fx > 0 ? state.logi.fx : FX_FALLBACK; }
function fxBookGet(code) {
  if (code === "CNY") return 1;
  if (code === "USD") return fxNow();
  const v = state.logi.fxBook ? state.logi.fxBook[code] : null;
  return (v > 0) ? v : (FX_BOOK_DEF[code] || 1);
}
function ccyFactor(c) { return fxBookGet(c || state.price.ccy); }
function symOf(c) { return (CCY_META[c] || CCY_META.USD).sym; }
function decOf(c, valLocal) {
  const m = CCY_META[c] || CCY_META.USD;
  if (m.dec === 0 && valLocal != null && Math.abs(valLocal) < 10) return 2;
  return m.dec;
}
/* cny: 人民币金额；ccy: 目标币种；dec: 强制小数位。小数位按折算后的本币金额判定 */
function ccyAmt(cny, ccy, dec) {
  ccy = ccy || state.price.ccy;
  const val = cny / ccyFactor(ccy);
  return symOf(ccy) + fmt(val, dec == null ? decOf(ccy, val) : dec);
}
function money(cny, dec) { return ccyAmt(cny, state.price.ccy, dec); }
function validDayNum() {
  return state.meta.validDays === "custom" ? clamp(toNum(state.meta.validCustom, 30), 1, 365) : Number(state.meta.validDays);
}
const UNIT_RU = { "件": "шт.", "台": "шт.", "个": "шт.", "只": "шт.", "辆": "шт.", "套": "компл.", "批": "партия",
  "吨": "т", "千克": "кг", "公斤": "кг", "克": "г", "米": "м", "平方米": "м²", "立方米": "м³",
  "箱": "кор.", "包": "пач.", "卷": "рул.", "张": "лист", "对": "пара", "打": "дюжина" };
function unitLabel(u) {
  const k = String(u == null ? "" : u).trim();
  if (!k) return "";
  return (lang === "ru" && UNIT_RU[k]) ? UNIT_RU[k] : k;
}

const FIELD_LABEL = { qty: "colQty", price: "colPrice", vatIn: "colVatIn", refund: "colRefund", duty: "colDuty", vat: "colVat" };
function tf(key, vars) {
  let s = t(key);
  Object.keys(vars || {}).forEach(k => { s = s.split("{" + k + "}").join(String(vars[k])); });
  return s;
}

function calc(fxOverride) {
  const warns = [], errs = [];
  const fx = (fxOverride > 0) ? fxOverride : fxNow();
  const fxFallback = !(fxOverride > 0) && !(state.logi.fx > 0);
  let insRateRaw = state.logi.insRate == null ? 0 : state.logi.insRate;
  if (insRateRaw >= 90) { errs.push(t("warnIns")); insRateRaw = 89.99; }
  const insRate = clamp(insRateRaw, 0, 89.99) / 100;
  const freightUsd = Math.max(0, n0(state.logi.freight));
  const clearance = Math.max(0, n0(state.logi.clearance));

  let purchaseTotal = 0, refundTotal = 0, totalQty = 0;
  const lines = state.lines.map((l, i) => {
    const qtyRaw = l.qty, priceRaw = l.price;
    const qty = Math.max(0, n0(qtyRaw)), price = Math.max(0, n0(priceRaw));
    if (qtyRaw != null && qtyRaw < 0) warns.push(tf("warnNeg", { n: i + 1, f: t("colQty") }));
    if (priceRaw != null && priceRaw < 0) warns.push(tf("warnNeg", { n: i + 1, f: t("colPrice") }));
    if (qty === 0) warns.push(tf("warnLineQty", { n: i + 1 }));
    if (price === 0) warns.push(tf("warnLinePrice", { n: i + 1 }));
    if (!String(l.hs || "").trim()) warns.push(tf("warnNoHs", { n: i + 1 }));

    ["vatIn", "refund", "duty", "vat"].forEach(k => {
      const v = l[k];
      if (v == null || v === "") warns.push(tf("warnRateEmpty", { n: i + 1, f: t(FIELD_LABEL[k]) }));
      else if (v < 0 || v > 100) errs.push(tf("warnRateRange", { n: i + 1, f: t(FIELD_LABEL[k]) }));
    });
    const vatIn = clamp(n0(l.vatIn), 0, 100) / 100;
    const rr = clamp(n0(l.refund), 0, 100) / 100;
    if (rr > vatIn + 1e-9) warns.push(tf("warnRefundGtVat", { n: i + 1 }));

    const sub = qty * price;
    const lineRefund = sub / (1 + vatIn) * rr;
    purchaseTotal += sub;
    refundTotal += lineRefund;
    totalQty += qty;
    return { l: l, idx: i, qty: qty, price: price, sub: sub, lineRefund: lineRefund, share: 0, dutyRate: clamp(n0(l.duty), 0, 100) / 100, vatRate: clamp(n0(l.vat), 0, 100) / 100, duty: 0, vat: 0, cifLine: 0 };
  });

  lines.forEach(x => { x.share = purchaseTotal > 0 ? x.sub / purchaseTotal : (totalQty > 0 ? x.qty / totalQty : 0); });

  const domesticTotal = ["domestic", "packing", "customs", "other"].reduce((s, k) => s + Math.max(0, n0(state.fees[k])), 0);
  const fobCny = purchaseTotal + domesticTotal - refundTotal;
  const fobUsd = fobCny / fx;
  const cifUsd = (fobUsd + freightUsd) / (1 - insRate);
  const insUsd = cifUsd - fobUsd - freightUsd;
  const cifCny = cifUsd * fx;
  const freightCny = freightUsd * fx;
  const insCny = insUsd * fx;

  let dutyTotal = 0, vatTotal = 0;
  lines.forEach(x => {
    x.cifLine = cifCny * x.share;
    x.duty = x.cifLine * x.dutyRate;
    x.vat = (x.cifLine + x.duty) * x.vatRate;
    dutyTotal += x.duty;
    vatTotal += x.vat;
  });

  const landedFull = cifCny + dutyTotal + vatTotal + clearance;
  const vatInCost = state.price.vatDeduct ? 0 : vatTotal;
  const landedCost = cifCny + dutyTotal + vatInCost + clearance;

  const baseMap = { FOB: fobCny, CFR: fobCny + freightCny, CIF: cifCny, DDP: landedCost };
  const base = baseMap[state.logi.terms] != null ? baseMap[state.logi.terms] : landedCost;

  const pRaw = Math.max(0, n0(state.price.profit));
  let p = pRaw / 100;
  if (state.price.mode === "margin") {
    if (p >= 1) { errs.push(t("warnMargin")); p = 0.9999; }
    if (pRaw >= 100) p = 0.9999;
  } else if (p > 10) { p = 10; }

  const quoteTotal = state.price.mode === "margin" ? base / (1 - p) : base * (1 + p);
  const quoteProfit = quoteTotal - base;
  const margin = quoteTotal > 0 ? quoteProfit / quoteTotal : 0;
  const quoteUnit = totalQty > 0 ? quoteTotal / totalQty : 0;
  const unitCost = totalQty > 0 ? landedFull / totalQty : 0;
  const ddpNet = quoteTotal - landedFull;

  if (totalQty <= 0) errs.push(t("warnTotalQty"));
  if (fxFallback) warns.push(tf("warnFx", { fx: fmt(FX_FALLBACK, 2) }));
  const validUntil = addDays(state.meta.date, validDayNum());
  const expired = !!validUntil && validUntil < todayStr();
  if (expired) warns.push(tf("warnExpired", { d: validUntil }));

  return {
    lines: lines, fx: fx, fxFallback: fxFallback, insRate: insRate, insRateRaw: insRateRaw,
    freightUsd: freightUsd, freightCny: freightCny, insUsd: insUsd, insCny: insCny,
    purchaseTotal: purchaseTotal, refundTotal: refundTotal, domesticTotal: domesticTotal,
    totalQty: totalQty, fobCny: fobCny, fobUsd: fobUsd, cifUsd: cifUsd, cifCny: cifCny,
    dutyTotal: dutyTotal, vatTotal: vatTotal, clearance: clearance,
    landedFull: landedFull, landedCost: landedCost, base: base, baseKey: state.logi.terms,
    quoteTotal: quoteTotal, quoteProfit: quoteProfit, margin: margin, quoteUnit: quoteUnit,
    unitCost: unitCost, ddpNet: ddpNet, validUntil: validUntil, expired: expired,
    warns: warns, errs: errs
  };
}

/* ---------------- 金额大写（英文 / 俄文 / 中文） ---------------- */
const EN_1 = ["ZERO", "ONE", "TWO", "THREE", "FOUR", "FIVE", "SIX", "SEVEN", "EIGHT", "NINE",
  "TEN", "ELEVEN", "TWELVE", "THIRTEEN", "FOURTEEN", "FIFTEEN", "SIXTEEN", "SEVENTEEN", "EIGHTEEN", "NINETEEN"];
const EN_10 = ["", "", "TWENTY", "THIRTY", "FORTY", "FIFTY", "SIXTY", "SEVENTY", "EIGHTY", "NINETY"];
function enHundreds(n) {
  const out = [];
  const h = Math.floor(n / 100), r = n % 100;
  if (h) out.push(EN_1[h] + " HUNDRED");
  if (r) {
    if (r < 20) out.push(EN_1[r]);
    else out.push(EN_10[Math.floor(r / 10)] + (r % 10 ? "-" + EN_1[r % 10] : ""));
  }
  return out.join(" ");
}
function enInt(n) {
  n = Math.floor(Math.abs(n));
  if (n === 0) return "ZERO";
  const scale = [[1e9, "BILLION"], [1e6, "MILLION"], [1e3, "THOUSAND"]];
  const parts = [];
  let rest = n;
  scale.forEach(([v, name]) => {
    const q = Math.floor(rest / v);
    if (q > 0) { parts.push(enHundreds(q) + " " + name); rest -= q * v; }
  });
  if (rest > 0) parts.push(enHundreds(rest));
  return parts.join(" ");
}
const RU_1M = ["ноль", "один", "два", "три", "четыре", "пять", "шесть", "семь", "восемь", "девять"];
const RU_1F = ["ноль", "одна", "две", "три", "четыре", "пять", "шесть", "семь", "восемь", "девять"];
const RU_TEEN = ["десять", "одиннадцать", "двенадцать", "тринадцать", "четырнадцать", "пятнадцать",
  "шестнадцать", "семнадцать", "восемнадцать", "девятнадцать"];
const RU_TEN = ["", "", "двадцать", "тридцать", "сорок", "пятьдесят", "шестьдесят", "семьдесят", "восемьдесят", "девяносто"];
const RU_HUND = ["", "сто", "двести", "триста", "четыреста", "пятьсот", "шестьсот", "семьсот", "восемьсот", "девятьсот"];
function ruPlural(n, forms) {
  const a = Math.abs(Math.floor(n)) % 100, d = a % 10;
  if (a >= 11 && a <= 14) return forms[2];
  if (d === 1) return forms[0];
  if (d >= 2 && d <= 4) return forms[1];
  return forms[2];
}
function ruHundreds(n, fem) {
  const out = [];
  const h = Math.floor(n / 100), r = n % 100;
  if (h) out.push(RU_HUND[h]);
  const ones = fem ? RU_1F : RU_1M;
  if (r >= 20) {
    out.push(RU_TEN[Math.floor(r / 10)]);
    if (r % 10) out.push(ones[r % 10]);
  } else if (r >= 10) out.push(RU_TEEN[r - 10]);
  else if (r > 0) out.push(ones[r]);
  return out.join(" ");
}
function ruInt(n) {
  n = Math.floor(Math.abs(n));
  if (n === 0) return "ноль";
  const groups = [];
  let rest = n;
  const scales = [
    { v: 1e9, forms: ["миллиард", "миллиарда", "миллиардов"], fem: false },
    { v: 1e6, forms: ["миллион", "миллиона", "миллионов"], fem: false },
    { v: 1e3, forms: ["тысяча", "тысячи", "тысяч"], fem: true }
  ];
  scales.forEach(s => {
    const q = Math.floor(rest / s.v);
    if (q > 0) { groups.push(ruHundreds(q, s.fem) + " " + ruPlural(q, s.forms)); rest -= q * s.v; }
  });
  if (rest > 0) groups.push(ruHundreds(rest, false));
  return groups.join(" ");
}
const SAY_EN = {
  USD: { main: "US DOLLARS", sub: "CENTS" },
  CNY: { main: "CHINESE YUAN", sub: "FEN" },
  KZT: { main: "KAZAKHSTANI TENGE", sub: "TIYN" },
  UZS: { main: "UZBEKISTANI SOM", sub: "TIYN" },
  RUB: { main: "RUSSIAN RUBLES", sub: "KOPECKS" }
};
const SAY_RU = {
  USD: { main: ["доллар США", "доллара США", "долларов США"], sub: ["цент", "цента", "центов"], fem: false },
  CNY: { main: ["юань", "юаня", "юаней"], sub: ["фэнь", "фэня", "фэней"], fem: false },
  KZT: { main: ["тенге", "тенге", "тенге"], sub: ["тиын", "тиына", "тиынов"], fem: false },
  UZS: { main: ["сум", "сума", "сумов"], sub: ["тиын", "тиына", "тиынов"], fem: false },
  RUB: { main: ["рубль", "рубля", "рублей"], sub: ["копейка", "копейки", "копеек"], fem: true }
};
const CN_DIGIT = ["零", "壹", "贰", "叁", "肆", "伍", "陆", "柒", "捌", "玖"];
const CN_U1 = ["", "拾", "佰", "仟"];
const CN_U2 = ["", "万", "亿"];
function zhUpperInt(n) {
  n = Math.floor(Math.abs(n));
  if (n === 0) return "零";
  const secs = [];
  let rest = n, i = 0;
  while (rest > 0 && i < 3) { secs.push(rest % 10000); rest = Math.floor(rest / 10000); i++; }
  const out = [];
  for (let k = secs.length - 1; k >= 0; k--) {
    const s = secs[k];
    if (s === 0) { if (out.length && out[out.length - 1] !== "零") out.push("零"); continue; }
    let str = "", zero = false;
    const digits = String(s).split("").map(Number);
    digits.forEach((d, idx) => {
      const pos = digits.length - 1 - idx;
      if (d === 0) { zero = true; }
      else {
        if (zero && str) str += "零";
        zero = false;
        str += CN_DIGIT[d] + CN_U1[pos];
      }
    });
    out.push(str + CN_U2[k]);
  }
  let s = out.join("");
  s = s.replace(/零+$/, "");
  return s || "零";
}
function zhUpperAmount(v) {
  const abs = Math.round(Math.abs(v) * 100) / 100;
  const int = Math.floor(abs + 1e-9);
  const cents = Math.round((abs - int) * 100);
  const jiao = Math.floor(cents / 10), fen = cents % 10;
  let s = zhUpperInt(int) + "元";
  if (jiao === 0 && fen === 0) return s + "整";
  if (jiao === 0) return s + "零" + CN_DIGIT[fen] + "分";
  s += CN_DIGIT[jiao] + "角";
  return fen ? s + CN_DIGIT[fen] + "分" : s + "整";
}
/* 返回 { en, ru, zh(可选) }；v 为报价币种本币金额 */
function amountWords(v, ccy) {
  const dec = decOf(ccy, v);
  const abs = Math.abs(v);
  const int = Math.floor(abs + 1e-9);
  const frac = dec === 0 ? 0 : Math.round((abs - int) * 100);
  const e = SAY_EN[ccy] || SAY_EN.USD;
  const en = "SAY TOTAL " + e.main + " " + enInt(int) +
    (frac > 0 ? " AND " + e.sub + " " + enInt(frac) : "") + " ONLY";
  const r = SAY_RU[ccy] || SAY_RU.USD;
  const ru = "Сумма прописью: " + ruInt(int) + " " + ruPlural(int, r.main) +
    (frac > 0 ? " " + String(frac).padStart(2, "0") + " " + ruPlural(frac, r.sub) : "");
  const zh = ccy === "CNY" ? "人民币" + zhUpperAmount(abs) : "";
  return { en: en, ru: ru, zh: zh };
}

/* ---------------- 柜型建议 ---------------- */
function suggestLoad(gw, vol) {
  if (!(gw > 0) && !(vol > 0)) return null;
  for (let i = 0; i < CONTAINERS.length; i++) {
    const c = CONTAINERS[i];
    if (vol <= c.cbm && gw <= c.kg) return { k: c.k, n: 1, cbm: c.cbm, kg: c.kg };
  }
  const last = CONTAINERS[CONTAINERS.length - 1];
  const n = Math.max(Math.ceil(vol / last.cbm), Math.ceil(gw / last.kg), 1);
  return { k: last.k, n: n, cbm: last.cbm, kg: last.kg };
}

/* 生成一份报价单 HTML；ov 可临时覆盖 币种 / 贸易术语 / 买方名称 / 付款方式，
   供「按客户批量导出」在多页打印区里复用同一套排版与口径 */
function sheetHTML(R, ov) {
  ov = ov || {};
  const ccy = ov.ccy || state.price.ccy, f = ccyFactor(ccy);
  const M = v => symOf(ccy) + fmt(v / f, decOf(ccy, v / f));
  const unit = v => symOf(ccy) + fmt(v / f, decOf(ccy, v / f));
  const srcKey = { builtin: "fxBuiltin", pboc: "fxPboc", bank: "fxBank", customs: "fxCustoms", manual: "fxManual" }[state.logi.fxSource] || "fxBuiltin";
  const fxOnline = (state.logi.fxMeta || {}).src === "online";
  const fxSrc = R.fxFallback ? t("sheetFxFallback") : (fxOnline ? t("fxSrcOnline") : t(srcKey));
  const countryName = t("c_" + state.logi.country);
  const termKey = ov.terms || state.logi.terms;
  const termName = t({ FOB: "termFob", CFR: "termCfr", CIF: "termCif", DDP: "termDdp" }[termKey]);
  const termHint = t({ FOB: "termsHintFob", CFR: "termsHintCfr", CIF: "termsHintCif", DDP: "termsHintDdp" }[termKey]);
  const parts = [];

  /* 抬头：Logo + 卖方联系信息 */
  const logo = logoData();
  const pt = state.party;
  const sellerMeta = [];
  if (pt.sellerAddr) sellerMeta.push(esc(pt.sellerAddr));
  const line2 = [];
  if (pt.sellerTel) line2.push("Tel: " + esc(pt.sellerTel));
  if (pt.sellerMail) line2.push("Email: " + esc(pt.sellerMail));
  if (pt.sellerWeb) line2.push(esc(pt.sellerWeb));
  if (line2.length) sellerMeta.push(line2.join(" · "));
  if (logo || pt.seller || sellerMeta.length) {
    parts.push('<div class="sh-top"><div class="sh-logo">' +
      (logo ? '<img src="' + logo + '" alt="logo">' : '<span class="ph">' + esc(pt.seller || "") + "</span>") +
      '</div><div class="sh-seller">' + (pt.seller ? "<strong>" + esc(pt.seller) + "</strong>" : "") +
      sellerMeta.map(x => "<div>" + x + "</div>").join("") + "</div></div>");
  }

  parts.push("<h3>" + esc(t("sheetTitle")) + "</h3>");
  const ccyNameS = (CCY_META[ccy] || CCY_META.USD)[lang === "ru" ? "ru" : "zh"];
  parts.push('<div class="sub-line">' + esc(ccy + " " + ccyNameS) + " · " + esc(termName) + "</div>");
  const metaBits = [
    esc(t("metaOfferNo")) + "：" + esc(state.meta.no || "—"),
    esc(t("metaDate")) + "：" + esc(state.meta.date || "—"),
    esc(t("sheetValid").split("：")[0].split(":")[0]) + "：" + esc(R.validUntil || "—") + (R.expired ? '<span class="expired">' + esc(t("sheetExpiredTag")) + "</span>" : ""),
    esc(t("thCountry")) + "：" + esc(countryName)
  ];
  // 汇率行单独构造，避免占位符残留
  const fxBits = ["1 USD = " + fmt(R.fx, 4) + " CNY"];
  if (ccy !== "USD" && ccy !== "CNY") fxBits.push("1 " + ccy + " = " + fmt(ccyFactor(), ccy === "UZS" ? 6 : 4) + " CNY");
  const fxLine = "FX：" + fxBits.join(" / ") + "（" + esc(state.logi.fxDate || "—") + "，" + esc(fxSrc) + "）";
  parts.push('<div class="meta">' + metaBits.map(x => "<span>" + x + "</span>").join("") + "<span>" + fxLine + "</span></div>");

  /* 买卖双方（含地址与卖方联系方式） */
  const buyerName = ov.buyer != null ? ov.buyer : pt.buyer;
  const buyerCell = esc(buyerName || "—") + (pt.buyerAddr ? '<div class="addr">' + esc(pt.buyerAddr) + "</div>" : "");
  /* 卖方地址/联系方式已在抬头出现，表格内只留名称，避免同一信息打印三遍 */
  const sellerCell = esc(pt.seller || "—");
  parts.push('<table class="kv"><tbody><tr><td>' + esc(t("thBuyer")) + "</td><td>" + buyerCell +
    "</td><td>" + esc(t("thSeller")) + "</td><td>" + sellerCell + "</td></tr></tbody></table>");

  /* 商务条款（仅输出已填写项） */
  const deal = Object.assign({}, state.deal || {});
  if (ov.pay) deal.pay = ov.pay;
  const dealRows = [
    [["payTerms", deal.pay], ["leadTime", deal.lead]],
    [["packing", deal.packing], ["origin", deal.origin]],
    [["moq", deal.moq], null]
  ].map(pair => {
    const cells = pair.map(p => {
      if (!p) return "<td></td><td></td>";
      const val = (p[1] || "").trim();
      if (!val) return "<td></td><td></td>";
      return "<td>" + esc(t(p[0])) + "</td><td>" + esc(val) + "</td>";
    }).join("");
    return cells;
  }).filter(r => r !== "<td></td><td></td><td></td><td></td>");
  if (dealRows.length) {
    parts.push('<table class="kv"><tbody>' + dealRows.map(r => "<tr>" + r + "</tr>").join("") + "</tbody></table>");
  }

  const head = "<thead><tr>" +
    "<th>" + esc(t("thIdx")) + "</th>" +
    "<th>" + esc(t("thProduct")) + "</th>" +
    "<th>" + esc(t("thHs")) + "</th>" +
    "<th style=\"text-align:right\">" + esc(t("colQty")) + "</th>" +
    "<th style=\"text-align:right\">" + esc(t("thUnitPrice")) + "</th>" +
    "<th style=\"text-align:right\">" + esc(t("thAmount")) + "</th>" +
    "</tr></thead>";
  /* 整数币种（KZT/UZS）必须保证「单价×数量=金额」「合计=Σ行金额」，否则客户核算差几元 */
  const decL = decOf(ccy, R.quoteTotal / f);
  const L = v => symOf(ccy) + fmt(v, decL);
  let sumLocal = 0;
  const body = R.lines.map((x, i) => {
    const amount = R.quoteTotal * x.share;
    const qty = x.qty > 0 ? x.qty : 0;
    let upCell, amtCell;
    if (decL === 0) {
      const upI = Math.round(amount / f / (qty || 1));
      const amtI = Math.round(upI * (qty || 1));
      sumLocal += amtI;
      upCell = L(upI); amtCell = L(amtI);
    } else {
      const up = qty > 0 ? amount / qty : 0;
      sumLocal += amount / f;
      upCell = unit(up); amtCell = M(amount);
    }
    const libName = HS_DB.filter(h => h.code === x.l.hs)[0];
    const nm = lang === "ru" && libName ? (x.l.product || libName.zh) + " / " + libName.ru : (x.l.product || "—");
    return "<tr><td>" + (i + 1) + "</td><td>" + esc(nm) + "</td><td>" + esc(x.l.hs || "—") + "</td><td class=\"r\">" + fmt(x.qty, 2) + " " + esc(unitLabel(x.l.unit)) + "</td><td class=\"r\">" + upCell + "</td><td class=\"r\">" + amtCell + "</td></tr>";
  }).join("");
  const footTotal = decL === 0 ? L(sumLocal) : M(R.quoteTotal);
  const foot = "<tfoot><tr><td colspan=\"5\">" + esc(t("thSubtotal")) + "（" + esc(ccy) + "）</td><td class=\"r big\">" + footTotal + "</td></tr></tfoot>";
  parts.push("<table>" + head + "<tbody>" + body + "</tbody>" + foot + "</table>");

  /* 金额大写（以报价单合计为准） */
  const localTotal = decL === 0 ? sumLocal : R.quoteTotal / f;
  const W = amountWords(localTotal, ccy);
  const sayLines = ['<div class="ln"><span class="lab">' + esc(t("sayTotal")) + "：</span>" + esc(W.en) + "</div>"];
  if (lang === "ru") sayLines.push('<div class="ln">' + esc(W.ru) + "</div>");
  if (W.zh) sayLines.push('<div class="ln">' + esc(W.zh) + "</div>");
  parts.push('<div class="say-box">' + sayLines.join("") + "</div>");

  /* 毛重 / 体积 / 柜型 */
  const gw = toNum(state.logi.gw, 0), vol = toNum(state.logi.vol, 0);
  const load = suggestLoad(gw, vol);
  if (load) {
    const bits = [];
    if (gw > 0) bits.push(t("grossWeight") + " " + fmt(gw, 2));
    if (vol > 0) bits.push(t("volumeCbm") + " " + fmt(vol, 3));
    bits.push(tf("loadSuggest", { n: load.n, k: load.k, cbm: load.cbm, kg: fmt(load.kg, 0) }));
    parts.push('<div class="ship-line">' + esc(bits.join(" · ")) + "</div>");
  }

  parts.push('<div class="terms-box">' + esc(tf("sheetPriceBasis", { terms: termName, ccy: ccy })) + "<br>" + esc(termHint) + "</div>");
  if (state.party.remark) parts.push('<table class="kv"><tbody><tr><td>' + esc(t("thRemark")) + "</td><td>" + esc(state.party.remark) + "</td></tr></tbody></table>");
  parts.push('<div class="sign"><span>' + esc(t("signLeft")) + "</span><span>" + esc(t("signRight")) + "</span></div>");
  parts.push('<div class="foot">' + esc(t("sheetFoot")) + (state.price.vatDeduct ? "<br>" + esc(t("sheetFootVat")) : "") + "</div>");
  return parts.join("");
}

/* ============================================================
   多客户批量比价（v3.10）
   同一批货、同一数量、同一成本，只改「报价方式 / 币种 / 贸易术语」，
   把 2~5 家客户的单价、整票金额、毛利与毛利率并排摊开比较，
   并能一次导出多份报价单（每位客户一页）。
   ============================================================ */
const MAX_CUST = 5;

function normalizeCustomer(c) {
  c = c || {};
  const mode = c.mode === "margin" ? "margin" : "markup";
  const ccy = CCY_LIST.indexOf(c.ccy) >= 0 ? c.ccy : "USD";
  const terms = TERMS.indexOf(c.terms) >= 0 ? c.terms : "DDP";
  const txt = (v, n) => (typeof v === "string" ? v.slice(0, n) : "");
  return {
    id: typeof c.id === "string" && c.id ? c.id : uid(),
    name: txt(c.name, 80),
    mode: mode,
    val: clamp(toNum(c.val, 0), 0, 999),
    ccy: ccy,
    terms: terms,
    pay: txt(c.pay, 120)
  };
}
function newCustomer() {
  return normalizeCustomer({
    mode: state.price.mode, val: state.price.profit,
    ccy: state.price.ccy, terms: state.logi.terms, pay: state.deal.pay || "", name: ""
  });
}
/* 临时把主报价参数换成某客户的口径执行 fn，结束后无条件还原（calc 只读 state） */
function withCust(c, fn) {
  const bp = { mode: state.price.mode, profit: state.price.profit, ccy: state.price.ccy };
  const bt = state.logi.terms;
  if (c) {
    if (c.mode === "margin" || c.mode === "markup") state.price.mode = c.mode;
    const v = toNum(c.val, NaN);
    if (!isNaN(v)) state.price.profit = v;
    if (CCY_LIST.indexOf(c.ccy) >= 0) state.price.ccy = c.ccy;
    if (TERMS.indexOf(c.terms) >= 0) state.logi.terms = c.terms;
  }
  let r;
  try { r = fn(); } finally {
    state.price.mode = bp.mode; state.price.profit = bp.profit; state.price.ccy = bp.ccy;
    state.logi.terms = bt;
  }
  return r;
}
function custCalc(c) { return withCust(c, () => calc()); }
function custLabel(c, i) {
  const n = String((c && c.name) || "").trim();
  return n || (t("srCustPlaceholder") + " " + (i + 1));
}
function custCondText(c) {
  const v = toNum(c.val, 0);
  const sv = (v > 0 ? "+" : "") + fmt(v, v % 1 ? 1 : 0);
  const pv = fmt(v, v % 1 ? 1 : 0);
  return c.mode === "margin" ? tf("srCustMarginTxt", { p: pv })
                             : tf("srCustMarkupTxt", { p: sv });
}
function custAmt(cny, ccy) {
  const v = cny / ccyFactor(ccy);
  return symOf(ccy) + fmt(v, decOf(ccy, v));
}
/* 比价行：同批货下每位客户的报价与利润 */
function custRows() {
  const list = (state && state.customers) || [];
  const baseR = calc();
  const baseMargin = baseR.margin;
  return list.map((c, i) => {
    const R = custCalc(c);
    const ccy = CCY_LIST.indexOf(c.ccy) >= 0 ? c.ccy : "USD";
    return {
      cust: c, idx: i, label: custLabel(c, i), cond: custCondText(c), ccy: ccy,
      unit: custAmt(R.quoteUnit, ccy), total: custAmt(R.quoteTotal, ccy),
      gp: custAmt(R.quoteProfit, ccy), margin: R.margin,
      diff: (R.margin - baseMargin), lose: R.margin < 0,
      thin: R.margin >= 0 && R.margin < 0.08, R: R
    };
  });
}

/* ---------------- 汇率：输入同步 / 状态 / 在线获取 ---------------- */
function fxDecimals(code) { return code === "UZS" ? 6 : 4; }
function syncFxInputs() {
  ["fxRUB", "fxKZT", "fxUZS"].forEach(id => {
    const el = $(id);
    if (!el) return;
    const code = id.slice(2);
    el.value = String(Number(fxBookGet(code).toFixed(fxDecimals(code))));
    el.classList.toggle("bad", !(state.logi.fxBook[code] > 0));
  });
  renderFxStamp();
}
function renderFxStamp() {
  const el = $("fxStamp");
  if (!el) return;
  const meta = state.logi.fxMeta || {};
  const online = meta.src === "online";
  const ccy = state.price.ccy;
  const stale = online && fxAgeHours(meta.at) > 24;
  el.className = "hint" + (online ? " on" : "") + (stale ? " stale" : "");
  el.textContent = tf("fxStamp", {
    ccy: ccy, fx: fmt(fxBookGet(ccy), ccy === "UZS" ? 6 : 4),
    src: online ? t("fxSrcOnline") : t("fxSrcManual"),
    at: meta.at || "—"
  }) + (stale ? " · " + t("fxStale") : "");
  el.title = meta.provider ? ("provider: " + meta.provider) : "";
}
function fxAgeHours(at) {
  if (!at) return 0;
  const t0 = Date.parse(String(at).replace(/-/g, "/"));
  if (!t0) return 0;
  return (Date.now() - t0) / 3600000;
}
function nowStamp() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function fetchJson(url, ms) {
  return new Promise((resolve, reject) => {
    const ctl = typeof AbortController !== "undefined" ? new AbortController() : null;
    const timer = setTimeout(() => { try { ctl && ctl.abort(); } catch (e) { } reject(new Error("timeout")); }, ms || 8000);
    fetch(url, { signal: ctl ? ctl.signal : undefined, cache: "no-store", mode: "cors" })
      .then(r => { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
      .then(j => { clearTimeout(timer); resolve(j); })
      .catch(e => { clearTimeout(timer); reject(e); });
  });
}
async function ratesFromSource() {
  try {
    const j = await fetchJson("https://open.er-api.com/v6/latest/USD", 8000);
    const r = (j && j.rates) || {};
    if (r.CNY > 0 && r.KZT > 0 && r.UZS > 0 && r.RUB > 0)
      return { usdCny: r.CNY, KZT: r.KZT, UZS: r.UZS, RUB: r.RUB, provider: "open.er-api.com", at: String(j.time_last_update_utc || "").slice(0, 16) };
  } catch (e) { /* 降级到备用源 */ }
  const j2 = await fetchJson("https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json", 8000);
  const r2 = (j2 && j2.usd) || {};
  if (!(r2.cny > 0 && r2.kzt > 0 && r2.uzs > 0 && r2.rub > 0)) throw new Error("bad payload");
  return { usdCny: r2.cny, KZT: r2.kzt, UZS: r2.uzs, RUB: r2.rub, provider: "fawazahmed0/currency-api", at: nowStamp() };
}
async function doFxOnline() {
  const btn = $("btnFxOnline");
  if (!btn) return;
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = t("fxLoading");
  try {
    const r = await ratesFromSource();
    state.logi.fx = Number(r.usdCny.toFixed(4));
    state.logi.fxBook.RUB = Number((r.usdCny / r.RUB).toFixed(6));
    state.logi.fxBook.KZT = Number((r.usdCny / r.KZT).toFixed(6));
    state.logi.fxBook.UZS = Number((r.usdCny / r.UZS).toFixed(8));
    state.logi.fxMeta = { src: "online", at: nowStamp(), provider: r.provider };
    state.logi.fxDate = todayStr();
    $("fxRate").value = String(state.logi.fx);
    syncFxInputs();
    $("fxDate").value = state.logi.fxDate;
    render();
    flash(tf("fxOnlineOk", { src: r.provider }));
  } catch (e) {
    const el = $("fxStamp");
    if (el) { el.className = "hint err"; el.textContent = t("fxOnlineFail"); }
    flash(t("fxOnlineFail"));
  } finally {
    btn.disabled = false;
    btn.textContent = t("btnFxOnline") || label;
  }
}
